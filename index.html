<!DOCTYPE html>
<!--
   REPO: ingram-manor/index.html
   ==========================================================================
   INGRAM MANOR LLC — the fleet
   ==========================================================================
   Three projects as three caravels, holding formation on the canal, bows to
   the viewer. Hover a ship and it lifts on the swell and names itself.
   Click and it comes forward while the card opens with the description and
   the link.

   The ships are the Treasure Chess caravels, ported out of the game: the
   same tapered V-hull, the same railings and posts, stateroom, mast, yard
   and gold trim, at the same proportions — everything driven off one sail
   width, as in the original. What is left behind is what only matters in a
   game: the piece glyphs, the constellation planes, the figure standing on
   deck and the king's treasure hold. The sail carries the project's banner
   where the constellation used to be.

   Nothing is downloaded. No models, no textures, no licences — the fleet is
   built in code from three primitives.

   THE ONLY THING TO EDIT is the PROJECTS array at the top of the module:
   title, kind, url, blurb, emblem. An empty url keeps the ship in formation
   and shows "not yet launched" instead of a dead link.

   No build step, no keys. Without WebGL the page shows the four as a plain
   list rather than a blank blue rectangle.
   ==========================================================================
-->

<script type="module">
import * as THREE from 'three';

/* ================================================================ the four */
const PROJECTS = [
  { id:'amenti', drive: 1.35, neon: 0xffd23a, title:'Amenti Interface', kind:'platform', emblem:'\u2625',
    url:'',
    blurb:'The Library of Legends. An AI-powered platform built on a database of historical figures \u2014 live chat with authentic historical characters, grounded in high quality primary source data.' },
  { id:'gannlab', drive: 1.0, neon: 0x35e6ff, title:'GannLab', kind:'research', emblem:'\u2691',
    url:'https://ianingram.github.io/GannLab/',
    blurb:'Fifty-nine pre-registered trading-hypothesis experiments, their run files, and an honest account of what survived. Mostly nothing did. The failures are the content.' },
  { id:'chess', drive: 0.86, neon: 0xff2bd6, title:'Treasure Chess', kind:'game', emblem:'\u265E',
    url:'',
    blurb:'Sea-battle chess played with a roster of historical characters. Fleets hold a wedge until the first move, then sail into the back rank. Every piece is somebody.' },
  { id:'x', drive: 1.15, neon: 0x7cff4f, title:'X', kind:'unannounced', emblem:'\u2715',
    url:'',
    blurb:'Not named yet. The hull is in the water and the rest follows.' },
  { id:'amentilive', drive: 0.94, neon: 0xff7a18, title:'Amenti.live', kind:'live', emblem:'\u2609',
    url:'',
    blurb:'Amenti, running. The public face of the Library of Legends, where the database becomes something you can walk through.' }
];

const card = document.getElementById('card');
const cardGo = document.getElementById('cardGo');
const tip = document.getElementById('tip');
const hint = document.getElementById('hint');

document.getElementById('fbList').innerHTML = PROJECTS.map(p =>
  `<article><a href="${p.url || '#'}">${p.title}</a><p>${p.blurb}</p></article>`).join('');

/* WebGL first: an old machine gets the list, not a blank rectangle. */
function hasWebGL() {
  try { const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch { return false; }
}
if (!hasWebGL()) {
  document.getElementById('fallback').style.display = 'block';
  throw new Error('no webgl - showing the list instead');
}

/* ================================================================ materials
   The game's palette: dark oak, gold trim, bone canvas, lit lantern. */
const oakMat    = new THREE.MeshStandardMaterial({ color: 0x3b2a1a, roughness: 0.86, metalness: 0.05 });
const deckMat   = new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.82, metalness: 0.04 });
const goldMat   = new THREE.MeshStandardMaterial({ color: 0xd4af50, roughness: 0.35, metalness: 0.75 });
const mastMat   = new THREE.MeshStandardMaterial({ color: 0x2e2118, roughness: 0.9 });
const windowMat    = new THREE.MeshStandardMaterial({ color: 0x1a1208, roughness: 0.95 });
const hullMat      = new THREE.MeshStandardMaterial({ color: 0x3b2a1a, roughness: 0.88, metalness: 0.05 });
const stateroomMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.85, metalness: 0.04 });
const lanternMat   = new THREE.MeshBasicMaterial({ color: 0xfce8a0 });

/* the caravel hull from the game: a trapezoidal prism, beam wider at the
   deck than at the keel, the keel shorter fore-and-aft than the deck line */
function taperedHull(length, beamTop, beamBot, height, lengthBot) {
  const hL = length / 2, hLb = lengthBot / 2, hBt = beamTop / 2, hBb = beamBot / 2;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    -hL, height, -hBt,   hL, height, -hBt,   hL, height, hBt,  -hL, height, hBt,
    -hLb, 0, -hBb,      hLb, 0, -hBb,       hLb, 0, hBb,      -hLb, 0, hBb
  ]), 3));
  g.setIndex([0,2,1, 0,3,2, 4,5,6, 4,6,7, 0,1,5, 0,5,4, 3,7,6, 3,6,2, 0,4,7, 0,7,3, 1,2,6, 1,6,5]);
  g.computeVertexNormals();
  return g;
}

/* the banner sail: a canvas texture, the emblem above the project's name,
   the way the game letters its sails */
/* The sail carries the project's name in gold thread. Two canvases come out
   of this: the cloth itself, and a second holding ONLY the embroidery, used
   as the emissive map. That is what keeps the lettering legible at dusk —
   the cloth darkens with the light, the gold does not, exactly as metal
   thread behaves when it catches what little light is left. */
function sailTexture(p) {
  const W = 512, H = 768;
  const cloth = document.createElement('canvas'); cloth.width = W; cloth.height = H;
  const glow  = document.createElement('canvas'); glow.width = W;  glow.height = H;
  const x = cloth.getContext('2d'), e = glow.getContext('2d');
  e.fillStyle = '#000'; e.fillRect(0, 0, W, H);

  x.fillStyle = '#fbfaf6'; x.fillRect(0, 0, W, H);      // bleached canvas
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,.05)');
  g.addColorStop(0.35, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.09)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(120,110,95,.10)'; x.lineWidth = 2;
  for (let i = 0; i < 9; i++) { x.beginPath(); x.moveTo(0, 84 * i + 40); x.lineTo(W, 84 * i + 40); x.stroke(); }
  x.fillStyle = '#7a1f1f'; x.fillRect(0, 0, W, 28);      // the red head

  /* embroidery: a dark couching line under bright thread, drawn onto both
     canvases so the cloth shows the stitch and the glow map shows the gold */
  function thread(draw) {
    for (const [ctx, shadow, metal] of [[x, 'rgba(70,50,14,.55)', null], [e, null, null]]) {
      if (shadow) {                                      // the dent the thread sits in
        ctx.save(); ctx.translate(0, 3);
        ctx.fillStyle = shadow; ctx.strokeStyle = shadow;
        draw(ctx); ctx.restore();
      }
      const grad = ctx.createLinearGradient(0, 0, 0, H); // gold catches light unevenly
      grad.addColorStop(0.00, '#8a6a1e');
      grad.addColorStop(0.35, '#f0d071');
      grad.addColorStop(0.52, '#fff3c4');
      grad.addColorStop(0.70, '#e0b64c');
      grad.addColorStop(1.00, '#9a7722');
      ctx.fillStyle = grad; ctx.strokeStyle = grad;
      draw(ctx);
    }
  }

  const words = p.title.toUpperCase().split(' ');
  thread(ctx => {
    ctx.textAlign = 'center';
    /* The emblems are drawn rather than typed. A font glyph depends on what
       the viewer happens to have installed — the ankh and the knight were
       rendering as empty boxes anywhere the font was missing — and a drawn
       mark can be as large and as heavy as the sail wants. */
    const cxE = W / 2, cyE = 232;
    if (p.id === 'gannlab') {
      /* a circle with a cross: the cardinal cross on the wheel, which is
         what the Square of Nine is */
      ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(cxE, cyE, 104, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(cxE - 132, cyE); ctx.lineTo(cxE + 132, cyE);
      ctx.moveTo(cxE, cyE - 132); ctx.lineTo(cxE, cyE + 132);
      ctx.stroke();
      ctx.lineWidth = 3;                                  // the diagonals, lighter
      ctx.beginPath();
      const q = 104 * 0.7071;
      ctx.moveTo(cxE - q, cyE - q); ctx.lineTo(cxE + q, cyE + q);
      ctx.moveTo(cxE + q, cyE - q); ctx.lineTo(cxE - q, cyE + q);
      ctx.stroke();
    } else if (p.id === 'amenti') {
      /* a dominant triangle, on its own */
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(cxE, cyE - 150);
      ctx.lineTo(cxE + 150, cyE + 112);
      ctx.lineTo(cxE - 150, cyE + 112);
      ctx.closePath();
      ctx.stroke();

    } else if (p.id === 'chess') {
      /* back to the knight it had: the glyph reads better than my outline did */
      ctx.font = '170px Georgia, serif';
      ctx.fillText(p.emblem, cxE, cyE + 60);
    } else if (p.id === 'amentilive') {
      /* a sun: the platform running */
      ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(cxE, cyE, 62, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 6;
      for (let i = 0; i < 12; i++) {
        const an = i * Math.PI / 6;
        ctx.beginPath();
        ctx.moveTo(cxE + Math.cos(an) * 84, cyE + Math.sin(an) * 84);
        ctx.lineTo(cxE + Math.cos(an) * 118, cyE + Math.sin(an) * 118);
        ctx.stroke();
      }
    } else {
      /* X, and anything unnamed */
      ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.moveTo(cxE - 92, cyE - 92); ctx.lineTo(cxE + 92, cyE + 92);
      ctx.moveTo(cxE + 92, cyE - 92); ctx.lineTo(cxE - 92, cyE + 92);
      ctx.stroke();
    }
    /* Letter-spaced by hand, character by character. Canvas has no tracking
       control worth relying on, and a name set solid under a large mark
       reads as a lump — the spacing is what makes it look lettered rather
       than typed. The gap under the emblem is opened up too, so the mark
       and the name are two things rather than one crowded block. */
    ctx.font = '600 52px ui-monospace, Menlo, monospace';
    const TRACK = 7;
    const drawTracked = (text, cy) => {
      const chars = [...text];
      const widths = chars.map(ch => ctx.measureText(ch).width);
      const total = widths.reduce((s2, w2) => s2 + w2, 0) + TRACK * (chars.length - 1);
      let cx2 = W / 2 - total / 2;
      ctx.textAlign = 'left';
      chars.forEach((ch, i) => { ctx.fillText(ch, cx2, cy); cx2 += widths[i] + TRACK; });
      ctx.textAlign = 'center';
    };
    words.forEach((w, i) => drawTracked(w, 452 + i * 66));
    /* the border runs round the whole sail rather than boxing the name: a
       heavy rule inset from the edge, a stitched rule inside it, and a
       corner mark at each turn, so the cloth is framed the way a banner is. */
    const M = 26;                                        // inset from the edge
    ctx.lineWidth = 6;
    ctx.strokeRect(M, M + 22, W - M * 2, H - M * 2 - 30);
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.strokeRect(M + 14, M + 36, W - (M + 14) * 2, H - (M + 14) * 2 - 30);
    ctx.setLineDash([]);
    ctx.lineWidth = 4;                                   // corner marks
    const cS = 34, x0 = M, y0 = M + 22, x1 = W - M, y1 = H - M - 8;
    for (const [px, py, sx, sy] of [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]]) {
      ctx.beginPath();
      ctx.moveTo(px + sx * cS, py + sy * 10);
      ctx.lineTo(px + sx * 10, py + sy * 10);
      ctx.lineTo(px + sx * 10, py + sy * cS);
      ctx.stroke();
    }
  });

  const map = new THREE.CanvasTexture(cloth);
  map.colorSpace = THREE.SRGBColorSpace;
  const emissive = new THREE.CanvasTexture(glow);
  emissive.colorSpace = THREE.SRGBColorSpace;
  return { map, emissive };
}

/* ------------------------------------------------- gilding and inlay
   The hull sides carry scrollwork: gold couched in a running arabesque
   along the topsides with silver inlaid inside the scrolls, the way a
   ceremonial hull is finished. Drawn onto a transparent canvas and hung on
   thin panels just outboard of the planking, so the hull geometry itself is
   untouched and the whole thing costs two quads a side.

   Every hull gets its own, so no two are the same run of scrolls. */
function gildTexture(seed) {
  const W = 512, H = 128;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  let n = seed || 7;
  const rnd = () => (n = (n * 16807) % 2147483647) / 2147483647;

  const GOLD = '#d9b458', GOLD_HI = '#f7e3a4', GOLD_LO = '#8a6a22', SILVER = '#cfd6dc';

  /* the two rules the scrollwork runs between */
  for (const y of [16, H - 16]) {
    x.strokeStyle = GOLD; x.lineWidth = 3;
    x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke();
    x.strokeStyle = GOLD_HI; x.lineWidth = 1;
    x.beginPath(); x.moveTo(0, y - 1.5); x.lineTo(W, y - 1.5); x.stroke();
  }

  /* a repeating scroll: a wave with a curl at each crest, and a leaf below */
  const step = 64;
  for (let i = 0; i < W / step + 1; i++) {
    const ox = i * step, up = i % 2 === 0;
    const midY = H / 2;
    x.strokeStyle = GOLD; x.lineWidth = 3.4; x.lineCap = 'round';
    x.beginPath();
    x.moveTo(ox, midY);
    x.bezierCurveTo(ox + step * 0.22, midY + (up ? -30 : 30),
                    ox + step * 0.62, midY + (up ? -34 : 34),
                    ox + step, midY);
    x.stroke();
    /* the curl */
    x.lineWidth = 2.4;
    x.beginPath();
    const cxp = ox + step * 0.5, cyp = midY + (up ? -26 : 26);
    x.arc(cxp, cyp, 9, up ? 0.5 : 3.6, up ? 4.6 : 7.7);
    x.stroke();
    /* silver inlaid in the eye of the curl */
    x.fillStyle = SILVER;
    x.beginPath(); x.arc(cxp, cyp, 3.4, 0, Math.PI * 2); x.fill();
    x.strokeStyle = GOLD_LO; x.lineWidth = 1;
    x.beginPath(); x.arc(cxp, cyp, 3.4, 0, Math.PI * 2); x.stroke();
    /* a small silver lozenge between scrolls */
    const lx = ox + step, ly = midY + (up ? 16 : -16);
    x.fillStyle = SILVER;
    x.beginPath();
    x.moveTo(lx, ly - 5); x.lineTo(lx + 4, ly); x.lineTo(lx, ly + 5); x.lineTo(lx - 4, ly);
    x.closePath(); x.fill();
    x.strokeStyle = GOLD; x.lineWidth = 1.2; x.stroke();
    /* a leaf off the stem */
    x.strokeStyle = GOLD; x.lineWidth = 2;
    x.beginPath();
    x.moveTo(ox + step * 0.5, midY + (up ? -6 : 6));
    x.quadraticCurveTo(ox + step * (0.5 + (rnd() - 0.5) * 0.3), midY + (up ? 14 : -14),
                       ox + step * 0.78, midY + (up ? 6 : -6));
    x.stroke();
  }

  /* a few loose studs, silver, along both rails */
  for (let i = 0; i < 26; i++) {
    x.fillStyle = i % 3 ? SILVER : GOLD_HI;
    const sx = (i + 0.5) * (W / 26);
    for (const sy of [16, H - 16]) { x.beginPath(); x.arc(sx, sy, 1.8, 0, Math.PI * 2); x.fill(); }
  }

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ================================================================== a ship
   The Treasure Chess caravel. Proportions are the game's: every dimension is
   a multiple of the sail width, so the whole vessel scales from one number.
   Kept — tapered V-hull, planked deck, railings with posts, the lowered
   stateroom aft, mast with cap, yard, sail cloth, gold trim, stern lantern.
   Dropped — the piece glyphs, the constellation plane, the chess piece on
   deck and the king's treasure hold, none of which mean anything here.

   The hull runs along X with the bow at -X, exactly as in the game, and the
   sail hangs athwartships facing the bow. Turning the ship a quarter turn
   puts both bow and sail square to the viewer. */
const SAIL_W = 7.5;

function buildShip(p) {
  const ship = new THREE.Group();
  const sailW = SAIL_W, sailH = sailW * (384 / 256);

  const HULL_L = sailW * 2.0;
  const HULL_W = sailW * 0.8;
  const HULL_H = sailH * 0.32;

  /* the hull: a trapezoidal prism, beam wider at the deck line than at the
     keel, and the keel shorter fore and aft, which reads as a soft V */
  function taperedHull(length, beamTop, beamBot, height, lengthBot) {
    const hL = length / 2, hLb = lengthBot / 2, hBt = beamTop / 2, hBb = beamBot / 2;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      -hL, height, -hBt,   hL, height, -hBt,   hL, height, hBt,  -hL, height, hBt,
      -hLb, 0, -hBb,      hLb, 0, -hBb,       hLb, 0, hBb,      -hLb, 0, hBb
    ]), 3));
    g.setIndex([0,2,1, 0,3,2, 4,5,6, 4,6,7, 0,1,5, 0,5,4, 3,7,6, 3,6,2, 0,4,7, 0,7,3, 1,2,6, 1,6,5]);
    g.computeVertexNormals();
    return g;
  }
  ship.add(new THREE.Mesh(
    taperedHull(HULL_L, HULL_W, HULL_W * 0.50, HULL_H, HULL_L * 0.88), hullMat));

  /* deck */
  const deckThk = HULL_H * 0.10, deckY = HULL_H + HULL_H * 0.05;
  const deck = new THREE.Mesh(
    new THREE.BoxGeometry(HULL_L * 0.95, deckThk, HULL_W * 0.94), deckMat);
  deck.position.y = deckY;
  ship.add(deck);

  /* railings: a rail down each side on posts, and one across the bow */
  const railH = HULL_H * 0.30, railR = sailW * 0.012;
  for (const zSign of [-1, 1]) {
    const rail = new THREE.Mesh(
      new THREE.BoxGeometry(HULL_L * 0.92, railR * 0.6, railR * 1.2), mastMat);
    rail.position.set(0, HULL_H + railH, zSign * HULL_W * 0.46);
    ship.add(rail);
    for (let i = 0; i < 11; i++) {
      const post = new THREE.Mesh(
        new THREE.BoxGeometry(railR * 1.4, railH, railR * 1.4), mastMat);
      post.position.set(((i + 0.5) / 11 - 0.5) * HULL_L * 0.92,
        HULL_H + railH / 2, zSign * HULL_W * 0.46);
      ship.add(post);
    }
  }
  const bowX = -HULL_L * 0.46;
  const cross = new THREE.Mesh(
    new THREE.BoxGeometry(railR * 1.2, railR * 0.6, HULL_W * 0.92), mastMat);
  cross.position.set(bowX, HULL_H + railH, 0);
  ship.add(cross);
  for (const zSign of [-1, 1]) {
    const corner = new THREE.Mesh(
      new THREE.BoxGeometry(railR * 1.4, railH, railR * 1.4), mastMat);
    corner.position.set(bowX, HULL_H + railH / 2, zSign * HULL_W * 0.46);
    ship.add(corner);
  }

  /* the lowered stateroom aft, its windows and its lantern */
  const roomD = HULL_L * 0.28, roomH = HULL_H * 1.05, roomW = HULL_W * 0.86;
  const roomX = HULL_L / 2 - roomD / 2 + sailW * 0.02;
  const roomY = HULL_H + HULL_H * 0.10 + roomH / 2;
  const room = new THREE.Mesh(new THREE.BoxGeometry(roomD, roomH, roomW), stateroomMat);
  room.position.set(roomX, roomY, 0);
  ship.add(room);
  for (const z of [-0.28, 0, 0.28]) {
    const win = new THREE.Mesh(
      new THREE.BoxGeometry(roomD * 0.05, roomH * 0.3, roomW * 0.16), windowMat);
    win.position.set(roomX + roomD / 2, roomY + roomH * 0.05, z * roomW);
    ship.add(win);
  }
  const lantern = new THREE.Mesh(new THREE.SphereGeometry(sailW * 0.035, 10, 8), lanternMat);
  lantern.position.set(roomX + roomD * 0.3, roomY + roomH * 0.62, 0);
  ship.add(lantern);

  /* gold trim: a band at the sheer on all four sides */
  const trimT = HULL_H * 0.06, trimW = HULL_W * 0.04, trimY = HULL_H - trimT * 0.5;
  for (const zSign of [-1, 1]) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(HULL_L * 0.99, trimT, trimW), goldMat);
    t.position.set(0, trimY, zSign * (HULL_W / 2 + trimW * 0.3));
    ship.add(t);
  }
  for (const xSign of [-1, 1]) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(trimW, trimT, HULL_W * 0.99), goldMat);
    t.position.set(xSign * (HULL_L / 2 + trimW * 0.3), trimY, 0);
    ship.add(t);
  }

  /* the gilding, on both topsides and across the transom */
  const gild = new THREE.MeshStandardMaterial({
    map: gildTexture(Math.floor(Math.random() * 99999)),
    transparent: true, roughness: 0.34, metalness: 0.65,
    emissive: 0x3a2c08, emissiveIntensity: 0.28, side: THREE.DoubleSide });
  for (const zSign of [-1, 1]) {
    const panel = new THREE.Mesh(
      new THREE.PlaneGeometry(HULL_L * 0.9, HULL_H * 0.66), gild);
    panel.position.set(0, HULL_H * 0.58, zSign * (HULL_W / 2 + 0.06));
    panel.rotation.y = zSign > 0 ? 0 : Math.PI;
    ship.add(panel);
  }
  const transom = new THREE.Mesh(
    new THREE.PlaneGeometry(HULL_W * 0.86, HULL_H * 0.6), gild);
  transom.rotation.y = Math.PI / 2;
  transom.position.set(HULL_L / 2 + 0.06, HULL_H * 0.58, 0);
  ship.add(transom);

  /* a silver strake at the waterline, under all the gold */
  const silverMat = new THREE.MeshStandardMaterial({
    color: 0xc6ced6, roughness: 0.3, metalness: 0.85 });
  for (const zSign of [-1, 1]) {
    const strake = new THREE.Mesh(
      new THREE.BoxGeometry(HULL_L * 0.94, HULL_H * 0.045, HULL_W * 0.03), silverMat);
    strake.position.set(0, HULL_H * 0.16, zSign * (HULL_W * 0.44));
    ship.add(strake);
  }

  /* more gold: a second stripe low on the hull, a band round the top of the
     stateroom, capping at the four corners of the sheer, and the rails
     themselves picked out. Kept thin — on a hull this size a wide band reads
     as paint rather than as brass. */
  const lowY = HULL_H * 0.42;
  for (const zSign of [-1, 1]) {
    const lo = new THREE.Mesh(
      new THREE.BoxGeometry(HULL_L * 0.9, trimT * 0.6, trimW * 0.8), goldMat);
    lo.position.set(0, lowY, zSign * (HULL_W / 2 + trimW * 0.2));
    ship.add(lo);
  }
  /* the band around the stateroom, and a moulding under it */
  const roomBand = new THREE.Mesh(
    new THREE.BoxGeometry(roomD * 1.02, trimT * 0.8, roomW * 1.02), goldMat);
  roomBand.position.set(roomX, roomY + roomH / 2 - trimT, 0);
  ship.add(roomBand);
  const roomSill = new THREE.Mesh(
    new THREE.BoxGeometry(roomD * 1.02, trimT * 0.5, roomW * 1.02), goldMat);
  roomSill.position.set(roomX, roomY - roomH / 2 + trimT, 0);
  ship.add(roomSill);
  /* corner posts at the sheer, where the trim meets */
  for (const xS of [-1, 1]) for (const zS of [-1, 1]) {
    const corner = new THREE.Mesh(
      new THREE.BoxGeometry(trimW * 1.4, trimT * 2.6, trimW * 1.4), goldMat);
    corner.position.set(xS * HULL_L * 0.48, trimY, zS * HULL_W * 0.5);
    ship.add(corner);
  }
  /* the rails, in brass rather than timber */
  for (const zSign of [-1, 1]) {
    const cap = new THREE.Mesh(
      new THREE.BoxGeometry(HULL_L * 0.92, railR * 0.5, railR * 1.4), goldMat);
    cap.position.set(0, HULL_H + railH + railR * 0.5, zSign * HULL_W * 0.46);
    ship.add(cap);
  }
  const bowCap = new THREE.Mesh(
    new THREE.BoxGeometry(railR * 1.4, railR * 0.5, HULL_W * 0.92), goldMat);
  bowCap.position.set(bowX, HULL_H + railH + railR * 0.5, 0);
  ship.add(bowCap);

  /* mast, cap and yard */
  const mastH = sailH * 1.6, mastR = sailW * 0.04;
  const mastX = sailW * 0.06, deckTop = HULL_H * 1.10;
  const mast = new THREE.Mesh(
    new THREE.CylinderGeometry(mastR * 0.85, mastR, mastH, 12), mastMat);
  mast.position.set(mastX, deckTop + mastH / 2, 0);
  ship.add(mast);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(mastR * 1.4, 8, 6), goldMat);
  cap.position.set(mastX, deckTop + mastH, 0);
  ship.add(cap);
  /* the cloth hangs clear of the spar: at 0.06 the ripple swung it through
     the mast, which then showed as a bar down the middle of the banner */
  const sailX = mastX - sailW * 0.2;
  const yardY = deckTop + mastH - sailH * 0.10;
  const yard = new THREE.Mesh(
    new THREE.CylinderGeometry(mastR * 0.85, mastR * 0.85, sailW * 1.25, 8), mastMat);
  yard.rotation.x = Math.PI / 2;
  yard.position.set(sailX, yardY, 0);
  ship.add(yard);
  for (const zS of [-1, 1]) {                      // brass caps on the yard arms
    const tip = new THREE.Mesh(new THREE.SphereGeometry(mastR * 1.1, 8, 6), goldMat);
    tip.position.set(sailX, yardY, zS * sailW * 0.625);
    ship.add(tip);
  }

  /* the sail, carrying the project's banner where the constellation was */
  const clothW = sailW * 1.15, clothH = sailH * 1.125;
  /* sailTexture hands back two canvases: the cloth, and the gold thread on
     its own. The thread goes in as the emissive map, so the lettering keeps
     its light when the sun has gone and the cloth itself has gone dark. */
  const sailTex = sailTexture(p);
  const sailMat = new THREE.MeshStandardMaterial({
    map: sailTex.map, emissiveMap: sailTex.emissive,
    color: 0xffffff, roughness: 0.82, metalness: 0,
    envMapIntensity: 0.35,                      // the sky is cold; keep it off the cloth
    emissive: 0xffe8a8, emissiveIntensity: 0.85, side: THREE.DoubleSide });
  /* The sail is given enough divisions to bend, and its rest shape kept so
     the ripple can be worked out from it each frame rather than accumulating
     drift. It is stiff at the yard where it is laced and loose at the foot,
     which is why the bottom corners move most. */
  const cloth = new THREE.Mesh(new THREE.PlaneGeometry(clothW, clothH, 18, 14), sailMat);
  cloth.geometry.userData.rest = Float32Array.from(cloth.geometry.attributes.position.array);
  cloth.rotation.y = -Math.PI / 2;                  // athwartships, facing the bow
  cloth.position.set(sailX, yardY - clothH / 2, 0);
  ship.add(cloth);

  /* a pennant at the masthead */
  const pen = new THREE.Mesh(new THREE.PlaneGeometry(sailW * 0.42, sailW * 0.1),
    new THREE.MeshStandardMaterial({ color: 0xc4202c, side: THREE.DoubleSide, roughness: 0.9 }));
  pen.rotation.y = -Math.PI / 2;
  pen.position.set(mastX, deckTop + mastH - sailW * 0.1, sailW * 0.2);
  ship.add(pen);

  /* where the hull meets the sea: a soft dark patch and a ring of foam, so
     the ship sits IN the water rather than on top of a blue sheet */
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(HULL_L * 0.46, 24),
    new THREE.MeshBasicMaterial({ color: 0x0a2430, transparent: true, opacity: 0.32,
      depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.scale.z = 0.42;
  shadow.position.y = 0.06;
  ship.add(shadow);


  /* ------------------------------------------------- it does not float
     The hull rides above the water rather than in it. Three things sell
     that: fins raked down and outboard at the stern, thruster glow under
     the keel pointing at the sea, and a pool of light on the surface
     beneath. Nothing touches the water, so the eye reads a gap. */
  const finMat = new THREE.MeshStandardMaterial({
    color: 0x2a2620, roughness: 0.42, metalness: 0.7, side: THREE.DoubleSide });
  for (const zS of [-1, 1]) {
    const fin = new THREE.Mesh(new THREE.BoxGeometry(HULL_L * 0.3, HULL_H * 0.07, HULL_W * 0.52), finMat);
    fin.position.set(HULL_L * 0.28, -HULL_H * 0.26, zS * HULL_W * 0.42);
    fin.rotation.z = -0.42;                       // raked down towards the stern
    fin.rotation.x = zS * 0.34;                   // and out, away from the hull
    ship.add(fin);
  }
  /* a smaller pair forward, so the craft reads as balanced */
  for (const zS of [-1, 1]) {
    const fin = new THREE.Mesh(new THREE.BoxGeometry(HULL_L * 0.16, HULL_H * 0.06, HULL_W * 0.34), finMat);
    fin.position.set(-HULL_L * 0.3, -HULL_H * 0.2, zS * HULL_W * 0.38);
    fin.rotation.z = -0.3;
    fin.rotation.x = zS * 0.3;
    ship.add(fin);
  }

  /* thruster wash under the keel */
  function washTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(32, 32, 1, 32, 32, 32);
    g.addColorStop(0.00, 'rgba(255,255,255,.95)');
    g.addColorStop(0.25, 'rgba(255,255,255,.35)');
    g.addColorStop(1.00, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  const washTex = washTexture();

/* Where the sun is, for a place and a moment. The usual low-precision solar
   position: day angle, declination, equation of time, hour angle. Good to
   well under a degree, which is far better than a horizon needs. */
function sunAngles(date, lat, lon) {
  /* Days since J2000.0 — the epoch every term below is written against. The
     first version of this mixed a day-of-year count into formulae expecting
     that, and put the midday sun twenty degrees under the horizon. */
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  const d = date.getTime() / 86400000 - 10957.5;

  const L = (280.460 + 0.9856474 * d) % 360;                 // mean longitude
  const g = ((357.528 + 0.9856003 * d) % 360) * rad;         // mean anomaly
  const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const eps = (23.439 - 0.0000004 * d) * rad;                // obliquity

  const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)) * deg;
  const dec = Math.asin(Math.sin(eps) * Math.sin(lam));

  const gmst = (18.697374558 + 24.06570982441908 * d) % 24;  // hours
  const lst = ((gmst * 15 + lon) % 360 + 360) % 360;         // degrees
  const H = ((lst - ra + 540) % 360 - 180) * rad;            // hour angle, -180..180

  const la = lat * rad;
  const alt = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(H));
  let az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(la) - Math.tan(dec) * Math.cos(la));
  az = (az * deg + 180) % 360;                               // from north, clockwise

       -   569.925 * Math.cos(2 * M)

function kepler(M, e) {
  let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));
  for (let k = 0; k < 6; k++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  return E;
}
function helio(el, d) {
  const rad = Math.PI / 180;
  const N = (el.N[0] + el.N[1] * d) * rad, i = (el.i[0] + el.i[1] * d) * rad;
  const w = (el.w[0] + el.w[1] * d) * rad, a = el.a;
  const e = el.e[0] + el.e[1] * d;
  const M = ((el.M[0] + el.M[1] * d) % 360 + 360) % 360 * rad;
  const E = kepler(M, e);
  const xv = a * (Math.cos(E) - e), yv = a * Math.sqrt(1 - e * e) * Math.sin(E);
  const v = Math.atan2(yv, xv), r = Math.hypot(xv, yv);
  return { x: r * (Math.cos(N) * Math.cos(v + w) - Math.sin(N) * Math.sin(v + w) * Math.cos(i)),
           y: r * (Math.sin(N) * Math.cos(v + w) + Math.cos(N) * Math.sin(v + w) * Math.cos(i)),

                        e:[0.016709, -1.151e-9], M:[356.0470, 0.9856002585] }, d);
  const pl = helio(ELEMENTS[name], d);
  const x = pl.x - earth.x, y = pl.y - earth.y, z = pl.z - earth.z;
  const eps = (23.4393 - 3.563e-7 * d) * rad;
  const ye = y * Math.cos(eps) - z * Math.sin(eps), ze = y * Math.sin(eps) + z * Math.cos(eps);
  const ra = Math.atan2(ye, x) * deg, dec = Math.atan2(ze, Math.hypot(x, ye));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
  const lst = ((gmst * 15 + lon) % 360 + 360) % 360;
  const H = ((lst - ra + 540) % 360 - 180) * rad, la = lat * rad;
  const alt = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(H));
  let az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(la) - Math.tan(dec) * Math.cos(la));
  az = ((az * deg + 180) % 360 + 360) % 360;
  return { alt: alt * deg, az: az * rad, eclLat: Math.atan2(z, Math.hypot(x, y)) * deg };
}

function moonPhaseNow(date) {

/* The Moon is repainted whenever its phase has moved enough to see. The lit
   part is drawn the way a phase actually works: the terminator is the edge
   of a circle seen at an angle, so it is an ellipse whose width runs from
   the full disc at new and full, through zero at the quarters, and whose
   side swaps as the Moon passes opposition. */
const moonCanvas = document.createElement('canvas');
moonCanvas.width = moonCanvas.height = 128;

function paintMoon(phase) {                 // 0 new, 0.25 first quarter, 0.5 full
  const x = moonCanvas.getContext('2d');
  x.clearRect(0, 0, 128, 128);
  const R = 58, cx = 64, cy = 64;

  /* the unlit disc: still faintly there, as earthshine makes it */
  x.fillStyle = 'rgba(96,102,116,.22)';
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill();

  /* Drawn as three steps inside the disc, which is exact and needs no
     clever arc sweeps: light the whole face, shade the half that is turned
     away, then let the terminator ellipse either eat into the lit side (a
     crescent) or spill into the dark one (a gibbous). Its width is the
     cosine of the phase angle — full radius at new and full, nothing at the
     quarters. */
  const d = Math.cos(phase * Math.PI * 2);        // +1 new, 0 quarter, -1 full
  const waxing = phase < 0.5;
  const LIT = '#ece9df', DARK = 'rgba(96,102,116,.22)';

  x.save();
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.clip();

  const g = x.createRadialGradient(cx - R * 0.2, cy - R * 0.2, 4, cx, cy, R);
  g.addColorStop(0.00, '#ffffff');
  g.addColorStop(0.72, LIT);
  g.addColorStop(1.00, '#c9c4b6');
  x.fillStyle = g;
  x.fillRect(cx - R, cy - R, R * 2, R * 2);

  x.globalCompositeOperation = 'source-over';      // the half turned away
  x.fillStyle = '#12161f';
  x.fillRect(waxing ? cx - R : cx, cy - R, R, R * 2);

  x.beginPath();                                   // the terminator
  x.ellipse(cx, cy, R * Math.abs(d), R, 0, 0, Math.PI * 2);
  x.fillStyle = d > 0 ? '#12161f' : g;             // crescent shades, gibbous lights
  x.fill();

  /* Maria as soft overlapping patches, not five grey discs — hard circles at
     this size read as a cartoon. Each fades to nothing at its edge, several
     to a sea, so they run together as the real ones do. */
  for (const [mx, my, mr] of [
    [50,48,20],[58,44,13],[43,56,12], [76,56,14],[83,63,9],
    [58,80,16],[49,86,10],[66,88,11], [86,84,8],[38,70,8]
  ]) {
    const sg = x.createRadialGradient(mx, my, mr * 0.15, mx, my, mr);
    sg.addColorStop(0.00, 'rgba(126,126,124,.30)');
    sg.addColorStop(0.55, 'rgba(132,132,128,.16)');
    sg.addColorStop(1.00, 'rgba(132,132,128,0)');
    x.fillStyle = sg;
    x.beginPath(); x.arc(mx, my, mr, 0, Math.PI * 2); x.fill();
  }
  for (let i = 0; i < 110; i++) {                  // a dusting, so it is not glassy
    const ang = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * R * 0.94;
    x.fillStyle = `rgba(${Math.random() > 0.5 ? '255,255,252' : '140,138,132'},.07)`;
    x.beginPath();
    x.arc(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr, 0.8 + Math.random() * 2.2, 0, Math.PI * 2);
    x.fill();
  }
  const limb = x.createRadialGradient(cx, cy, R * 0.55, cx, cy, R);   // limb darkening
  limb.addColorStop(0.00, 'rgba(0,0,0,0)');
  limb.addColorStop(0.82, 'rgba(24,26,32,.10)');
  limb.addColorStop(1.00, 'rgba(24,26,32,.42)');
  x.fillStyle = limb;
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill();
  x.restore();

  /* mask back to a disc. restore() above put back the old fill style, which
     was the 22 per cent unlit grey — masking with that made the whole Moon
     that transparent. The mask must be fully opaque. */
  x.globalCompositeOperation = 'destination-in';
  x.fillStyle = '#000';
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'source-over';
  return moonCanvas;
}

function greatCircle(dir, color, weight) {

}

/* --------------------------------------------------------- the etching
   The motif the whole scene hangs on: circuit trace. Everything that is not
   ship or water is etched with it — the blocks of the middle ground and the
   faces of the pyramid — because the work is digital and the traces are what
   that looks like.

   Drawn procedurally so no two surfaces carry the same board: a walk that
   turns only at right angles and 45s, the way a router lays copper, with
   pads where a trace terminates, vias punched through, and the odd bus of
   parallel lines. Returned as one texture used twice per material — as the
   colour map and as the emissive map — so the traces glow faintly and the
   substrate between them stays matte. */
function circuitTexture(px, density, substrate, trace, ink) {
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const x = c.getContext('2d');
  x.fillStyle = substrate;
  x.fillRect(0, 0, px, px);

  const g = px / 22;                                  // routing grid, coarse on purpose
  let seed = 1 + Math.floor(Math.random() * 99999);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const snap = v => Math.round(v / g) * g;
  const W = px / 150;                                 // a trace you can see at distance
  x.lineCap = 'butt';
  x.lineJoin = 'miter';

  /* copper pours: broad low-contrast fills that give the board its zones */
  for (let i = 0; i < 4; i++) {
    x.globalAlpha = 0.10;
    x.fillStyle = trace;
    const w = snap(px * (0.18 + rnd() * 0.3)), h = snap(px * (0.12 + rnd() * 0.26));
    x.fillRect(snap(rnd() * (px - w)), snap(rnd() * (px - h)), w, h);
  }

  /* buses: the thing that makes a board look routed rather than doodled */
  for (let b = 0; b < Math.round(density * 0.5); b++) {
    const vert = rnd() > 0.5;
    const n = 3 + Math.floor(rnd() * 5);
    const at = snap(rnd() * px), from = snap(rnd() * px), len = px * (0.25 + rnd() * 0.5);
    x.strokeStyle = trace;
    x.globalAlpha = 0.85;
    x.lineWidth = W;
    for (let i = 0; i < n; i++) {
      const off = at + i * g * 0.42;
      x.beginPath();
      if (vert) { x.moveTo(off, from); x.lineTo(off, from + len); }
      else { x.moveTo(from, off); x.lineTo(from + len, off); }
      x.stroke();
    }
  }

  /* traces: orthogonal, with the corners chamfered the way copper is mitred.
     No long diagonals — those were what made the first version read as
     scribble rather than as a board. */
  for (let t = 0; t < density; t++) {
    let cx = snap(rnd() * px), cy = snap(rnd() * px);
    let horiz = rnd() > 0.5;
    x.strokeStyle = trace;
    x.globalAlpha = 0.9;
    x.lineWidth = W * (rnd() > 0.7 ? 1.9 : 1);
    x.beginPath();
    x.moveTo(cx, cy);
    const legs = 2 + Math.floor(rnd() * 4);
    for (let i = 0; i < legs; i++) {
      const run = g * (1 + Math.floor(rnd() * 4));
      const dir = rnd() > 0.5 ? 1 : -1;
      const ch = Math.min(g * 0.5, run * 0.35);       // the chamfer
      if (horiz) {
        x.lineTo(cx + (run - ch) * dir, cy);
        cx += run * dir;
        const vd = rnd() > 0.5 ? 1 : -1;
        x.lineTo(cx, cy + ch * vd);
        cy += ch * vd;
      } else {
        x.lineTo(cx, cy + (run - ch) * dir);
        cy += run * dir;
        const hd = rnd() > 0.5 ? 1 : -1;
        x.lineTo(cx + ch * hd, cy);
        cx += ch * hd;
      }
      horiz = !horiz;
    }
    x.stroke();
    x.globalAlpha = 1;                                 // the pad it lands on
    x.fillStyle = trace;
    x.beginPath(); x.arc(cx, cy, W * 2.4, 0, Math.PI * 2); x.fill();
    x.fillStyle = substrate;
    x.beginPath(); x.arc(cx, cy, W * 1.0, 0, Math.PI * 2); x.fill();
  }

  /* chips: a footprint with two rows of pins, which reads as a component
     even when the whole board is only a hundred pixels on screen */
  for (let i = 0; i < Math.max(2, Math.round(density / 6)); i++) {
    const w = g * (2 + Math.floor(rnd() * 3)), h = g * (1 + Math.floor(rnd() * 2));
    const bx = snap(rnd() * (px - w)), by = snap(rnd() * (px - h));
    x.globalAlpha = 0.92;
    x.fillStyle = ink;
    x.fillRect(bx, by, w, h);
    x.fillStyle = trace;
    const pins = Math.max(3, Math.round(w / (g * 0.5)));
    for (let q = 0; q < pins; q++) {
      const pxx = bx + (q + 0.5) * (w / pins) - W * 0.6;
      x.fillRect(pxx, by - W * 2.2, W * 1.2, W * 2.2);
      x.fillRect(pxx, by + h, W * 1.2, W * 2.2);
    }
    x.globalAlpha = 0.5;                               // pin-1 dot
    x.fillStyle = substrate;
    x.beginPath(); x.arc(bx + g * 0.25, by + g * 0.25, W * 1.1, 0, Math.PI * 2); x.fill();
  }

  /* loose vias */
  for (let v = 0; v < density; v++) {
    x.globalAlpha = 0.7;
    x.fillStyle = trace;
    x.beginPath(); x.arc(snap(rnd() * px), snap(rnd() * px), W * 1.3, 0, Math.PI * 2); x.fill();
  }
  x.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

/* ----------------------------------------------------------- the pyramid
   Far out beyond the bank, in the Amenti manner: the body translucent and
   low-contrast so it reads as distance rather than as an object, its edges
   picked out in burnished gold, and the capstone detached — floating a gap
   above the truncated apex, turning slowly and catching more light than
   anything else in the scene.

   Fog is off for all of it. At this distance the fog would erase it, and the
   haze is in the material instead, which is how the game handles its own
   backdrop. */
const PY_H = 132, PY_R = 150, PY_Z = -430;
const pyramid = new THREE.Group();
pyramid.position.set(0, 0, PY_Z);

const bodyGeo = new THREE.ConeGeometry(PY_R, PY_H, 4, 1, true);
/* the faces are a smooth gradient, not a board: the etching read as noise at
   this distance and fought the silhouette. Dense at the base, thinning as it
   rises, so the pyramid dissolves towards its own apex and the capstone is
   the one solid thing up there. */
function pyramidGradient() {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.00, '#f2f7f8');      // apex, nearly sky
  g.addColorStop(0.35, '#dae8ec');
  g.addColorStop(0.72, '#c4d8de');
  g.addColorStop(1.00, '#a9c4cd');      // base, where it meets the water
  x.fillStyle = g;
  x.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const pyTex = pyramidGradient();
const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({
  map: pyTex,
  color: 0xffffff, transparent: true, opacity: 0.32, depthWrite: false,
  fog: false, side: THREE.DoubleSide, roughness: 0.9, metalness: 0.0,
  emissive: 0xbcd4dc, emissiveIntensity: 0.12 }));
body.rotation.y = Math.PI / 4;                   // a face towards the viewer
body.position.y = PY_H / 2;
body.renderOrder = -52;
pyramid.add(body);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(bodyGeo),
  new THREE.LineBasicMaterial({ color: 0xb89a4e, transparent: true,
    opacity: 0.40, depthWrite: false, fog: false }));
edges.rotation.y = Math.PI / 4;
edges.position.y = PY_H / 2;
edges.renderOrder = -51;
pyramid.add(edges);

/* the capstone, floating clear of the apex */
/* Smaller, and sitting closer to the apex. At 17 per cent of the pyramid's
   width, with a halo seven times its own radius, it read as a separate
   object floating in front of the scene rather than the stone off the top
   of that pyramid. */
const CAP_R = PY_R * 0.0525, CAP_H = PY_H * 0.0575, CAP_GAP = PY_H * 0.03;
/* The capstone is a group, not a single cone. A cone's base cap was either
   missing or invisible from below, so the stone read as a hollow shell with
   a bright rim and the sky showing through it. This way the four faces and
   the base are separate meshes, and the base is definitely there: a square
   plane turned to face straight down, dark, lit by nothing. */
const capFaceMat = new THREE.MeshStandardMaterial({
  color: 0xe8c463, roughness: 0.22, metalness: 0.9,
  emissive: 0x6b4f14, emissiveIntensity: 0.55, fog: false });
const capBaseMat = new THREE.MeshBasicMaterial({
  color: 0x140e07, fog: false });          // flat black-brown: its own shadow

const capstone = new THREE.Group();
const capCone = new THREE.Mesh(
  new THREE.ConeGeometry(CAP_R, CAP_H, 4, 1, true), capFaceMat);   // open; the base is its own mesh
capstone.add(capCone);
const capBase = new THREE.Mesh(
  new THREE.PlaneGeometry(CAP_R * Math.SQRT2, CAP_R * Math.SQRT2), capBaseMat);
/* A cone with four segments puts its base corners at 0, 90, 180 and 270
   degrees; a plane puts its corners at 45 between those. Spinning the square
   a further 45 in its own plane brings the two into register. */
capBase.rotation.set(Math.PI / 2, 0, Math.PI / 4);
capBase.position.y = -CAP_H / 2 + 0.01;    // sit flush under the faces
capstone.add(capBase);
capstone.rotation.y = Math.PI / 4;
capstone.position.y = PY_H + CAP_GAP + CAP_H / 2;
capstone.renderOrder = -50;
pyramid.add(capstone);
const capEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(capCone.geometry),

    depthWrite: false, fog: false }));

capEdges.position.copy(capstone.position);
capEdges.renderOrder = -49;
pyramid.add(capEdges);
/* a halo behind it, so the gold has something to sit in */
function haloTexture() {
  const c = document.createElement('canvas');

  g.addColorStop(0.28, 'rgba(255,214,120,.30)');
  g.addColorStop(0.62, 'rgba(255,200,96,.08)');
  g.addColorStop(1.00, 'rgba(255,200,96,0)');

}

/* the beacon: a shaft of light standing straight up out of the capstone,

}
const BEAM_H = PY_H * 2.0;
const beam = new THREE.Mesh(
  /* CylinderGeometry takes the TOP radius first: narrow above, wider where it

/* ------------------------------------------------------- the Giza clock
   The construction probe 41 tested, running live. A body's RISING azimuth
   selects a point on the pyramid's perimeter; that point maps to one of
   the 210 courses; the course is lit as a band round the pyramid and a ray
   runs out along the bearing it rose on.

   Jupiter is the clock's own hand, but from most places on most nights
   Jupiter is under the horizon and the instrument has nothing to read. So
   it takes the highest body that has actually risen — Jupiter first if it
   is up, then Mars, Saturn, Venus, Mercury, and the Moon, which nearly
   always is. The stamp says which one it is reading.

   Probe 41 retired this as a signal: detrended, the azimuth correlates
   with price at r = 0.021. It is kept here as what it honestly is, which
   is a clock. */
const GIZA_AZ = [62.49, 107.22];         // the azimuth range at the Great Pyramid
const COURSES = 210;
const CLOCK_ORDER = ['Jupiter', 'Mars', 'Saturn', 'Venus', 'Mercury'];

const bodyAlt = (n, d, la, lo) =>
  n === 'Moon' ? moonPosition(d, la, lo).alt : planetPosition(n, d, la, lo).alt;
const bodyAz = (n, d, la, lo) =>
  n === 'Moon' ? moonPosition(d, la, lo).az : planetPosition(n, d, la, lo).az;

/* the bearing it rose on, searched backwards; or the next rise if it is down */
function riseAzimuth(n, date, la, lo, back) {
  let prev = bodyAlt(n, date, la, lo);
  for (let m = 10; m <= 60 * 28; m += 10) {
    const t = new Date(date.getTime() + (back ? -m : m) * 60000);
    const a = bodyAlt(n, t, la, lo);
    const crossed = back ? (a < 0 && prev >= 0) : (prev < 0 && a >= 0);
    if (crossed) return { az: bodyAz(n, t, la, lo) * 180 / Math.PI, when: t };
    prev = a;
  }
  return null;
}
function clockReading(date, la, lo) {
  let pick = null, best = 3;
  for (const n of CLOCK_ORDER) {
    const a = bodyAlt(n, date, la, lo);
    if (n === 'Jupiter' && a > 3) { pick = n; break; }
    if (a > best) { pick = n; best = a; }
  }
  if (!pick && bodyAlt('Moon', date, la, lo) > 3) pick = 'Moon';
  const name = pick || 'Jupiter';
  const r = riseAzimuth(name, date, la, lo, !!pick) ||
            riseAzimuth(name, date, la, lo, false);
  return r ? { body: name, az: r.az, up: !!pick } : null;
}
const courseFor = az =>
  Math.round(Math.min(1, Math.max(0, (az - GIZA_AZ[0]) / (GIZA_AZ[1] - GIZA_AZ[0]))) * (COURSES - 1));

const clockBand = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints([0,1,2,3].map(k =>
    new THREE.Vector3(Math.cos(k * Math.PI/2 + Math.PI/4), 0, Math.sin(k * Math.PI/2 + Math.PI/4)))),
  new THREE.LineBasicMaterial({ color: 0xffd98a, transparent: true, opacity: 0.6,
    depthWrite: false, fog: false }));
pyramid.add(clockBand);
const clockRay = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineBasicMaterial({ color: 0xffc860, transparent: true, opacity: 0.4,
    depthWrite: false, fog: false }));
scene.add(clockRay);

let clockLast = 0, clockRead = null;
function updateClock(nowMs) {
  if (nowMs - clockLast < 60000 && clockRead) return;      // once a minute is plenty
  clockLast = nowMs;
  const read = clockReading(new Date(nowMs), place.lat, place.lon);
  if (!read) { clockBand.visible = clockRay.visible = false; return; }
  clockBand.visible = clockRay.visible = true;
  clockRead = { body: read.body, az: read.az, course: courseFor(read.az), up: read.up };

  const f = clockRead.course / COURSES;
  clockBand.position.y = PY_H * f;
  const r = PY_R * (1 - f) * Math.SQRT2;
  clockBand.scale.set(r, 1, r);

  const az = read.az * Math.PI / 180, y = PY_H * f * 0.6;
  const pa = clockRay.geometry.attributes.position;
  pa.setXYZ(0, 0, y, 0);
  pa.setXYZ(1, -Math.cos(az) * PY_R * 3.2, y, Math.sin(az) * PY_R * 3.2);
  pa.needsUpdate = true;
  clockRay.position.set(0, 0, PY_Z);
  clockRay.geometry.computeBoundingSphere();
}

/* ------------------------------------------------------------------- mist
   Banks lying on the water: wide, very soft sprites drifting at different
   depths and speeds, plus a thin band along the horizon that thickens and
   thins. They pass in front of the ships and behind them, so the fleet sits
   IN the air rather than against a backdrop, and they take the colour of
   whatever the sky is doing. Eight quads and one texture. */
function mistTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  for (let i = 0; i < 46; i++) {
    const px = Math.random() * 256, py = 28 + (Math.random() - 0.5) * 34;
    const r = 18 + Math.random() * 54;
    const g = x.createRadialGradient(px, py, 1, px, py, r);
    g.addColorStop(0.00, 'rgba(255,255,255,.085)');
    g.addColorStop(0.55, 'rgba(255,255,255,.035)');
    g.addColorStop(1.00, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.beginPath(); x.ellipse(px, py, r, r * 0.42, 0, 0, Math.PI * 2); x.fill();
  }
  const fade = x.createLinearGradient(0, 0, 0, 64);   // no straight edges
  fade.addColorStop(0.00, 'rgba(0,0,0,1)');
  fade.addColorStop(0.30, 'rgba(0,0,0,0)');
  fade.addColorStop(0.72, 'rgba(0,0,0,0)');
  fade.addColorStop(1.00, 'rgba(0,0,0,1)');
  x.globalCompositeOperation = 'destination-out';
  x.fillStyle = fade;
  x.fillRect(0, 0, 256, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

const mistTex = mistTexture();
const MIST = [];
for (let i = 0; i < 7; i++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(260 + i * 46, 16 + (i % 3) * 7),
    new THREE.MeshBasicMaterial({ map: mistTex.clone(), transparent: true, depthWrite: false,
      fog: false, opacity: 0 }));
  m.material.map.needsUpdate = true;
  m.material.map.repeat.set(1.4 + i * 0.2, 1);
  m.material.map.offset.x = Math.random();
  m.position.set(0, 1.5 + (i % 3) * 2.4, 40 - i * 26);
  m.renderOrder = 3;
  m.userData = { drift: (i % 2 ? 1 : -1) * (0.004 + i * 0.0016),
                 puff: 0.7 + i * 0.37, base: 0.30 + (i % 3) * 0.12 };
  scene.add(m);
  MIST.push(m);
}
const horizonMist = new THREE.Mesh(new THREE.PlaneGeometry(2200, 26),
  new THREE.MeshBasicMaterial({ map: mistTex.clone(), transparent: true, depthWrite: false,
    fog: false, opacity: 0 }));
horizonMist.material.map.repeat.set(8, 1);
horizonMist.position.set(0, 5, -520);
horizonMist.renderOrder = 2;
horizonMist.userData = { drift: 0.0015, puff: 0.31, base: 0.5 };
scene.add(horizonMist);
MIST.push(horizonMist);

/* ================================================== the fleet, in formation
   A shallow V with its point towards the viewer, every bow turned to face

/* A chevron opening away from the viewer rather than a closed V: the two
   lead ships abreast, the outer pair set back and wider. Nothing stands

/* A chevron opening away from the viewer rather than a closed V: the two
   lead ships abreast, the outer pair set back and wider. Nothing stands
   behind anything, so all four sails read at once. */
/* A wedge with its point towards the viewer: Amenti leads, the other two

/* A wedge with its point towards the viewer: Amenti leads, GannLab and
   Treasure Chess sit back on either quarter, and two more stand further out

const FORMATION = [
  { x:   0, z:   6 },   // Amenti, the lead ship

  { x:  26, z: -16 },   // Treasure Chess

  { x:  56, z: -42 }    // Amenti.live, far out on the right wing

/* ------------------------------------------------------- the reflections
   Each ship gets a mirrored twin under the surface: the same geometry with
   its Y flipped, drawn before the water and without writing depth, so the
   sea lies over it. Two shared materials rather than a copy of all
   forty-three — a reflection in moving water is a smear of tone, not a
   second ship, and this way three reflections cost two materials.

   The twin stretches and slides a little on the swell, which is what sells
   it: a still reflection under moving water looks painted on. */
/* A reflection dims as it goes down and gives out well before the mast would
   reach: chop breaks the far end of it up long before that. So the twin is
   foreshortened, faded with depth in the shader, and clipped hard at the
   point where there would be nothing left to see anyway. */
/* The craft hover about seven units up, so their mirror images start seven
   units DOWN and the old floor of nine cut them off almost immediately.
   Deeper floor, and the fade is measured from the surface rather than from
   the craft. */
const REF_FLOOR = 26;                      // how deep a reflection survives
renderer.localClippingEnabled = true;
const refClip = new THREE.Plane(new THREE.Vector3(0, 1, 0), REF_FLOOR);

function fadeWithDepth(mat) {
  mat.onBeforeCompile = shader => {
    shader.vertexShader = 'varying float vDepthY;\n' + shader.vertexShader
      .replace('#include <begin_vertex>',
               '#include <begin_vertex>\n  vDepthY = (modelMatrix * vec4(position, 1.0)).y;');
    shader.fragmentShader = 'varying float vDepthY;\n' + shader.fragmentShader
      .replace('#include <dithering_fragment>',
               '#include <dithering_fragment>\n  gl_FragColor.a *= clamp(1.0 + vDepthY / ' +
               REF_FLOOR.toFixed(1) + ', 0.0, 1.0);');
  };
  return mat;
}

const refDark = fadeWithDepth(new THREE.MeshBasicMaterial({ color: 0x1b2a33, transparent: true,
  opacity: 0.40, depthWrite: false, fog: true, clippingPlanes: [refClip] }));
const refPale = fadeWithDepth(new THREE.MeshBasicMaterial({ color: 0xdfe8ea, transparent: true,
  opacity: 0.30, depthWrite: false, fog: true, clippingPlanes: [refClip] }));

for (const ship of ships) {
  const twin = ship.clone(true);
  /* the reflection carries the craft's own colour rather than a shared grey:
     five accents in the water, one under each ship */
  const tint = new THREE.MeshBasicMaterial({
    color: new THREE.Color(ship.userData.project.neon || 0x35e6ff).multiplyScalar(0.55),
    transparent: true, opacity: 0.52, depthWrite: false, fog: true,
    clippingPlanes: [refClip] });
  fadeWithDepth(tint);
  twin.traverse(o => {
    if (!o.isMesh) return;
    o.material = (o.material && o.material.map) ? refPale : tint;
    o.renderOrder = 0;
    o.castShadow = o.receiveShadow = false;
  });
  twin.scale.y = -0.55;                    // mirrored and foreshortened
  twin.userData.of = ship;
  scene.add(twin);
  ship.userData.twin = twin;
}

camera.position.copy(CAM_HOME);

/* ============================================================= interaction */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let hovered = null, chosen = null, dragging = false, px = 0, py = 0, yaw = 0, pitch = 0;

function shipUnder(ev) {
  pointerOn = true;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(ships, true)[0];
  if (!hit) return null;
  let o = hit.object;
  while (o && !o.userData.project) o = o.parent;
  return o || null;
}

renderer.domElement.addEventListener('pointermove', ev => {
  if (dragging) {
    /* all the way round. A target can be anywhere on the compass, so the
       view has to reach anywhere on the compass. */
    yaw -= (ev.clientX - px) * 0.0032;
    /* the view has to reach the sky: a body forty degrees up has to be
       brought into the frame before the drive will engage, and at the old
       limit of 0.32 it could not be reached at all. */
    pitch = Math.max(-0.12, Math.min(1.5, pitch + (ev.clientY - py) * 0.0022));
    px = ev.clientX; py = ev.clientY;
    return;
  }
  const s = shipUnder(ev);
  if (s !== hovered) {
    hovered = s;
    /* the card is a click, not a hover: it was rising and dropping every
       time the pointer crossed a hull, which made the whole thing twitch */
    renderer.domElement.style.cursor = s ? 'pointer' : 'grab';
  }
  if (s) {
    tip.textContent = s.userData.project.title.toUpperCase();
    tip.style.left = ev.clientX + 'px';
    tip.style.top = ev.clientY + 'px';
    tip.classList.add('on');
  } else tip.classList.remove('on');
});
renderer.domElement.addEventListener('pointerdown', ev => {
  dragging = true; px = ev.clientX; py = ev.clientY;
  if (renderer.domElement.setPointerCapture) renderer.domElement.setPointerCapture(ev.pointerId);
});
renderer.domElement.addEventListener('pointerup', ev => {
  dragging = false;
  if (Math.abs(ev.clientX - px) + Math.abs(ev.clientY - py) < 6) {
    const s = shipUnder(ev);
    if (s) { choose(s); craft = s; refreshHud(); return; }
    const b = bodyUnder(ev);                     // a body in the sky becomes the target
    if (b) { target = b; refreshHud(); return; }
    release();
  }
});
renderer.domElement.addEventListener('pointerenter', () => { pointerOn = true; });
renderer.domElement.addEventListener('pointerleave', () => {
  pointerOn = false;
  dragging = false; tip.classList.remove('on');
  if (hovered) { hovered = null; cardFor(null); }
});

/* The card follows the mouse rather than a click: point at a ship and it
   rises, leave the fleet and it drops again. Clicking still holds a ship —
   it comes forward and stays out while you read, and the card then stays up
   even when the mouse wanders off. */
function fillCard(p) {
  document.getElementById('cardKind').textContent = p.kind;
  document.getElementById('cardTitle').textContent = p.title;
  document.getElementById('cardBlurb').textContent = p.blurb;
  if (p.url) {
    cardGo.href = p.url; cardGo.textContent = 'Open ' + p.title;
    cardGo.removeAttribute('aria-disabled');
  } else {
    cardGo.href = '#'; cardGo.textContent = 'Not yet launched';
    cardGo.setAttribute('aria-disabled', 'true');
  }
  card.classList.add('up');
  card.setAttribute('aria-hidden', 'false');
  hint.classList.add('gone');
}
function hideCard() {
  card.classList.remove('up');
  card.setAttribute('aria-hidden', 'true');
}
/* dropping the card is delayed a moment, so crossing a gap between two ships
   does not make it flicker */
let dropTimer = null;
function cardFor(s) {
  if (dropTimer) { clearTimeout(dropTimer); dropTimer = null; }
  if (s) { fillCard(s.userData.project); return; }
  if (chosen) return;                       // a held ship keeps its card
  dropTimer = setTimeout(() => { if (!chosen) hideCard(); dropTimer = null; }, 260);
}
function choose(s) {
  if (chosen === s) { release(); return; }
  chosen = s;
  fillCard(s.userData.project);
}
function release() {
  chosen = null;
  cardFor(hovered);                         // fall back to whatever is hovered
}

/* ===================================================== flight =============
   Pick a craft, lock a body, jump to it.

   THE RULE: a body must be genuinely available before the drive will
   engage. Two conditions, both real — it has to be ABOVE THE HORIZON at
   your location and this moment, and it has to be INSIDE THE FRAME. You
   cannot jump to something that is under the earth or behind you; you have
   to bring it into view first. That is the whole navigation problem here,
   and it is the reason the sky is computed rather than decorated.

   Energy is not modelled. Every craft can reach anything it can see.
   ========================================================================= */
/* ====================================================== the jump clock ====
   Not a gate. A CLOCK: it runs whether or not anyone is watching, and at
   any moment it holds two answers for every body — what a jump costs right
   now, and when tonight it will be cheapest.

   Everything is always reachable. Jupiter under the horizon is not a
   refusal, it is a price: the Earth is in the way and the solution has to
   go round it. What you buy by waiting, or by turning to look, is a
   cheaper solve.

   THE PRICE IS TIME, since the drives have energy to spare. Cost is the
   spool the craft needs before it can go, in seconds:

     range      how far, against the Moon as one unit
     occlusion  how far below the horizon, if it is under
     off-axis   how far from where the craft is pointed
     drive      the craft's own coefficient; the five differ

   The clock can look ahead because the sky is computed rather than drawn:
   asking where Mars will be at 03:40 is the same call as asking where it
   is now. So it scans the next twenty-four hours and reports the minimum,
   which turns waiting into a move you can choose.
   ========================================================================= */
const MOON_MEAN = 384400;                 // one unit of range

function bodyRangeKm(name, date) {
  if (name === 'Moon') return moonRangeKm(date);
  const d = date.getTime() / 86400000 - 10957.5;
  const earth = helio({ N:[0,0], i:[0,0], w:[282.9404, 4.70935e-5], a:1,
                        e:[0.016709,-1.151e-9], M:[356.0470,0.9856002585] }, d);
  const pl = helio(ELEMENTS[name], d);
  return Math.hypot(pl.x - earth.x, pl.y - earth.y, pl.z - earth.z) * 149597870.7;
}

/* jumpCost: what the drive has to spool, in seconds */
function jumpCost(name, date, lat, lon, drive, offAxisDeg) {
  const alt = name === 'Moon' ? moonPosition(date, lat, lon).alt
                              : planetPosition(name, date, lat, lon).alt;
  const km = bodyRangeKm(name, date);
  const range = Math.sqrt(km / MOON_MEAN);              // distance, softened
  const occl = alt >= 0 ? 1 : 1 + Math.pow(-alt / 90, 0.8) * 7;   // through the Earth
  const axis = 1 + (offAxisDeg === undefined ? 0 : offAxisDeg / 180) * 1.6;
  return 2.2 * range * occl * axis / (drive || 1);
}

/* the cheapest moment in the next day, and what it costs there */
function cheapestWindow(name, lat, lon, drive) {
  const now = Date.now();
  let bestT = now, bestC = Infinity;
  for (let m = 0; m <= 24 * 60; m += 15) {              // every quarter hour
    const t = new Date(now + m * 60000);
    const c = jumpCost(name, t, lat, lon, drive);       // ignoring aim: you can turn
    if (c < bestC) { bestC = c; bestT = t.getTime(); }
  }
  return { at: bestT, cost: bestC };
}

const hudShip = document.getElementById('hudShip');

/* A ring on the locked body, and a chevron at the edge of the frame when it
   is off screen. Hunting a speck with the pointer was the hardest part of
   the whole thing; now the table picks it, the view slews to it, and the
   marker says where it went. */
function reticleTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  x.strokeStyle = 'rgba(255,220,140,.95)';
  x.lineWidth = 4;
  x.beginPath(); x.arc(64, 64, 40, 0, Math.PI * 2); x.stroke();
  x.lineWidth = 3;
  for (const a of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) {   // four ticks
    x.beginPath();
    x.moveTo(64 + Math.cos(a) * 46, 64 + Math.sin(a) * 46);
    x.lineTo(64 + Math.cos(a) * 60, 64 + Math.sin(a) * 60);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const reticle = new THREE.Sprite(new THREE.SpriteMaterial({
  map: reticleTexture(), transparent: true, depthWrite: false, depthTest: false,
  fog: false, opacity: 0 }));
reticle.scale.setScalar(90);
scene.add(reticle);

let slew = null;             // the view swinging onto a target
let craft = null;            // the ship that flies
let pendingCost = 3;         // the spool the next jump needs, in seconds
let target = null;           // the body it is locked to
let flight = null;           // the jump in progress
let arrived = null;          // where we are, once there

/* how far away things really are, in kilometres, so the arrival can say
   something true rather than a number chosen to look good */
const AU = 149597870.7;
function bodyRange(name, date) {
  if (name === 'Moon') return 384400;
  const d = date.getTime() / 86400000 - 10957.5;
  const earth = helio({ N:[0,0], i:[0,0], w:[282.9404, 4.70935e-5], a:1,
                        e:[0.016709,-1.151e-9], M:[356.0470,0.9856002585] }, d);
  const pl = helio(ELEMENTS[name], d);
  return Math.hypot(pl.x - earth.x, pl.y - earth.y, pl.z - earth.z) * AU;
}

/* is this body usable: up, and in the frame? */
const _v = new THREE.Vector3();
function targetState(pl) {
  if (!pl || !pl.sprite) return { ok: false, why: 'no target' };
  const wp = pl.sprite.getWorldPosition(_v.clone());
  /* above the horizon */
  if (wp.y <= 0) return { ok: false, why: pl.name.toLowerCase() + ' is below the horizon' };
  /* and inside the frame */
  /* In front of the camera, and inside the frame. The projected depth is
     useless here — a body nine hundred units out rounds to exactly 1.0
     against the far plane, so the old test could never pass. What matters
     is the angle off the axis. */
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  const toBody = wp.clone().sub(camera.position).normalize();
  if (fwd.dot(toBody) <= 0.15) return { ok: false, why: 'bring ' + pl.name.toLowerCase() + ' into view' };
  const p = wp.clone().project(camera);
  const inFrame = Math.abs(p.x) < 0.94 && Math.abs(p.y) < 0.94;
  if (!inFrame) return { ok: false, why: 'bring ' + pl.name.toLowerCase() + ' into view' };
  if (pl.sprite.material.opacity < 0.05)
    return { ok: false, why: pl.name.toLowerCase() + ' is lost in daylight' };
  return { ok: true, why: 'ready' };
}

function bodyUnder(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  ray.params.Sprite = { threshold: 0.1 };
  const hit = ray.intersectObjects(PLANETS.map(p => p.sprite).filter(Boolean), false)[0];
  if (!hit) return null;
  return PLANETS.find(p => p.sprite === hit.object) || null;
}

const jcrEl = document.getElementById('jcr');
let jcrRows = [], jcrScanAt = 0, jcrData = [];

const hhmm = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const secs = c => c < 90 ? c.toFixed(0) + 's' : (c / 60).toFixed(1) + 'm';

function scanJCR() {
  const drive = craft ? (craft.userData.project.drive || 1) : 1;
  jcrData = PLANETS.map(pl => {
    const w = cheapestWindow(pl.real || 'Moon', place.lat, place.lon, drive);
    return { pl, name: pl.name, best: w };
  });
  jcrScanAt = Date.now();
}
function drawJCR() {
  const drive = craft ? (craft.userData.project.drive || 1) : 1;
  if (!jcrData.length || Date.now() - jcrScanAt > 120000) scanJCR();
  const now = new Date();
  const rows = jcrData.map(d => {
    const st = targetState(d.pl);
    const off = offAxisDeg(d.pl);
    const nowCost = jumpCost(d.pl.real || 'Moon', now, place.lat, place.lon, drive, off);
    return { ...d, nowCost, ok: st.ok };
  }).sort((a, b) => a.nowCost - b.nowCost);
  const cheapest = rows[0];
  drawGlyphs(cheapest ? cheapest.name : null);
  jcrEl.innerHTML = rows.map(r =>
    `<div class="jrow${target === r.pl ? ' on' : ''}${r === cheapest ? ' cheap' : ''}" data-b="${r.name}">` +
    `<span>${r.name.toLowerCase()}</span>` +
    `<span class="c">${secs(r.nowCost)}</span>` +
    `<span class="c">${secs(r.best.cost)} ${hhmm(r.best.at)}</span></div>`).join('');
  for (const el of jcrEl.querySelectorAll('.jrow'))
    el.addEventListener('click', () => {
      target = PLANETS.find(p => p.name === el.dataset.b) || null;
      if (target) aimAt(target);           // and take the view to it
      refreshHud();
    });
}
/* how far off the aim a body is, in degrees */
const _fwd = new THREE.Vector3(), _to = new THREE.Vector3();
function offAxisDeg(pl) {
  if (!pl || !pl.sprite) return 90;
  camera.getWorldDirection(_fwd);
  _to.copy(pl.sprite.getWorldPosition(new THREE.Vector3())).sub(camera.position).normalize();
  return Math.acos(Math.max(-1, Math.min(1, _fwd.dot(_to)))) * 180 / Math.PI;
}

/* swing the view onto a body: a bearing and an elevation, eased over about
   a second. The body may be under the horizon, in which case the view goes
   to the right compass point and looks down at the water — which is itself
   worth seeing, because it says where the thing is. */
function aimAt(pl) {
  if (!pl || !pl.sprite) return;
  const w = pl.sprite.getWorldPosition(new THREE.Vector3());
  const h = Math.hypot(w.x, w.z);
  slew = {
    yaw: Math.atan2(-w.x, -w.z),
    el: Math.atan2(w.y, h)
  };
}

function refreshHud() {
  hudShip.textContent = craft ? craft.userData.project.title : 'none';
  hudTarget.textContent = arrived ? arrived.name + ' orbit'
                                  : (target ? target.name : 'none');
  if (flight) { hudWhy.textContent = 'jumping'; jumpBtn.disabled = true; return; }
  if (arrived) {
    /* in orbit: the readout is where you are, not a status word */
    const km = arrived.km.toLocaleString(undefined, { maximumFractionDigits: 0 });
    const lt = arrived.km / 299792.458;
    hudWhy.textContent = `${km} km · light ${lt < 90 ? lt.toFixed(0) + 's' : (lt / 60).toFixed(0) + 'm'}`;
    hudWindow.textContent = 'in orbit';
    jumpBtn.disabled = true;
    return;
  }
  if (!craft) { hudWhy.textContent = 'pick a craft'; jumpBtn.disabled = true; lockBtn.disabled = true; return; }
  if (!target) { hudWhy.textContent = 'pick a body'; jumpBtn.disabled = true; lockBtn.disabled = true; return; }
  /* never refused — priced. The status line is the spool this jump needs
     from where the craft is pointed, right now. */
  const drive = craft.userData.project.drive || 1;
  const cost = jumpCost(target.real || 'Moon', new Date(), place.lat, place.lon,
                        drive, offAxisDeg(target));
  const st = targetState(target);
  hudWhy.textContent = `${secs(cost)} spool${st.ok ? '' : ' · blind'}`;
  jumpBtn.disabled = false;
  jumpBtn.textContent = 'jump · ' + secs(cost);
  lockBtn.disabled = false;

  /* the countdown, and what waiting is worth */
  if (locked) {
    const left = locked.at - Date.now();
    const save = cost - locked.cost;
    hudWindow.textContent = left <= 0
      ? 'open · ' + secs(locked.cost)
      : hms(left) + (save > 0.5 ? ' · saves ' + secs(save) : '');
    jumpBtn.classList.toggle('open', left <= 0);
    if (locked.pl !== target) { locked = null; lockBtn.classList.remove('armed'); lockBtn.textContent = 'lock on'; }
  } else {
    hudWindow.textContent = '—';
    jumpBtn.classList.remove('open');
  }
  pendingCost = cost;
  drawJCR();
}
