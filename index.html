   tightly so the near water has detail a flat colour cannot give it, a long
   swell worked into the vertices, and a horizon band painted into the
   texture so the far water lifts towards the sky instead of ending in a
   hard line. */
function waterNormals() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#8080ff'; x.fillRect(0, 0, 256, 256);   // flat normal
  for (let i = 0; i < 1400; i++) {                        // chop
    const px = Math.random() * 256, py = Math.random() * 256;
    const r = 2 + Math.random() * 7, a = Math.random() * Math.PI;
    const g = x.createLinearGradient(px - Math.cos(a) * r, py - Math.sin(a) * r,
                                     px + Math.cos(a) * r, py + Math.sin(a) * r);
    g.addColorStop(0, 'rgba(110,110,255,.55)');
    g.addColorStop(0.5, 'rgba(128,128,255,0)');
    g.addColorStop(1, 'rgba(150,150,255,.55)');
    x.fillStyle = g;
    x.beginPath(); x.ellipse(px, py, r * 2.2, r, a, 0, Math.PI * 2); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(28, 28);
  return t;
}

const waterGeo = new THREE.PlaneGeometry(900, 900, 120, 120);
const waterNrm = waterNormals();
const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({
  color: 0x2e8fb4, roughness: 0.10, metalness: 0.78,
  envMap: sky, envMapIntensity: 1.1,
  transparent: true, opacity: 0.93,            // so the mirrored hulls read through it
  normalMap: waterNrm, normalScale: new THREE.Vector2(0.55, 0.55) }));
water.renderOrder = 1;
water.rotation.x = -Math.PI / 2;
water.position.y = 0;
scene.add(water);
const waterBase = Float32Array.from(waterGeo.attributes.position.array);

/* --------------------------------------------------------- the etching
   The motif the whole scene hangs on: circuit trace. Everything that is not
   ship or water is etched with it — the blocks of the middle ground and the
   faces of the pyramid — because the work is digital and the traces are what
   that looks like.

   Drawn procedurally so no two surfaces carry the same board: a walk that
   turns only at right angles and 45s, the way a router lays copper, with
   pads where a trace terminates, vias punched through, and the odd bus of
   parallel lines. Returned as one texture used twice per material — as the
   colour map and as the emissive map — so the traces glow faintly and the
   substrate between them stays matte. */
function circuitTexture(px, density, substrate, trace, ink) {
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const x = c.getContext('2d');
  x.fillStyle = substrate;
  x.fillRect(0, 0, px, px);

  const g = px / 22;                                  // routing grid, coarse on purpose
  let seed = 1 + Math.floor(Math.random() * 99999);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const snap = v => Math.round(v / g) * g;
  const W = px / 150;                                 // a trace you can see at distance
  x.lineCap = 'butt';
  x.lineJoin = 'miter';

  /* copper pours: broad low-contrast fills that give the board its zones */
  for (let i = 0; i < 4; i++) {
    x.globalAlpha = 0.10;
    x.fillStyle = trace;
    const w = snap(px * (0.18 + rnd() * 0.3)), h = snap(px * (0.12 + rnd() * 0.26));
    x.fillRect(snap(rnd() * (px - w)), snap(rnd() * (px - h)), w, h);
  }

  /* buses: the thing that makes a board look routed rather than doodled */
  for (let b = 0; b < Math.round(density * 0.5); b++) {
    const vert = rnd() > 0.5;
    const n = 3 + Math.floor(rnd() * 5);
    const at = snap(rnd() * px), from = snap(rnd() * px), len = px * (0.25 + rnd() * 0.5);
    x.strokeStyle = trace;
    x.globalAlpha = 0.85;
    x.lineWidth = W;
    for (let i = 0; i < n; i++) {
      const off = at + i * g * 0.42;
      x.beginPath();
      if (vert) { x.moveTo(off, from); x.lineTo(off, from + len); }
      else { x.moveTo(from, off); x.lineTo(from + len, off); }
      x.stroke();
    }
  }

  /* traces: orthogonal, with the corners chamfered the way copper is mitred.
     No long diagonals — those were what made the first version read as
     scribble rather than as a board. */
  for (let t = 0; t < density; t++) {
    let cx = snap(rnd() * px), cy = snap(rnd() * px);
    let horiz = rnd() > 0.5;
    x.strokeStyle = trace;
    x.globalAlpha = 0.9;
    x.lineWidth = W * (rnd() > 0.7 ? 1.9 : 1);
    x.beginPath();
    x.moveTo(cx, cy);
    const legs = 2 + Math.floor(rnd() * 4);
    for (let i = 0; i < legs; i++) {
      const run = g * (1 + Math.floor(rnd() * 4));
      const dir = rnd() > 0.5 ? 1 : -1;
      const ch = Math.min(g * 0.5, run * 0.35);       // the chamfer
      if (horiz) {
        x.lineTo(cx + (run - ch) * dir, cy);
        cx += run * dir;
        const vd = rnd() > 0.5 ? 1 : -1;
        x.lineTo(cx, cy + ch * vd);
        cy += ch * vd;
      } else {
        x.lineTo(cx, cy + (run - ch) * dir);
        cy += run * dir;
        const hd = rnd() > 0.5 ? 1 : -1;
        x.lineTo(cx + ch * hd, cy);
        cx += ch * hd;
      }
      horiz = !horiz;
    }
    x.stroke();
    x.globalAlpha = 1;                                 // the pad it lands on
    x.fillStyle = trace;
    x.beginPath(); x.arc(cx, cy, W * 2.4, 0, Math.PI * 2); x.fill();
    x.fillStyle = substrate;
    x.beginPath(); x.arc(cx, cy, W * 1.0, 0, Math.PI * 2); x.fill();
  }

  /* chips: a footprint with two rows of pins, which reads as a component
     even when the whole board is only a hundred pixels on screen */
  for (let i = 0; i < Math.max(2, Math.round(density / 6)); i++) {
    const w = g * (2 + Math.floor(rnd() * 3)), h = g * (1 + Math.floor(rnd() * 2));
    const bx = snap(rnd() * (px - w)), by = snap(rnd() * (px - h));
    x.globalAlpha = 0.92;
    x.fillStyle = ink;
    x.fillRect(bx, by, w, h);
    x.fillStyle = trace;
    const pins = Math.max(3, Math.round(w / (g * 0.5)));
    for (let q = 0; q < pins; q++) {
      const pxx = bx + (q + 0.5) * (w / pins) - W * 0.6;
      x.fillRect(pxx, by - W * 2.2, W * 1.2, W * 2.2);
      x.fillRect(pxx, by + h, W * 1.2, W * 2.2);
    }
    x.globalAlpha = 0.5;                               // pin-1 dot
    x.fillStyle = substrate;
    x.beginPath(); x.arc(bx + g * 0.25, by + g * 0.25, W * 1.1, 0, Math.PI * 2); x.fill();
  }

  /* loose vias */
  for (let v = 0; v < density; v++) {
    x.globalAlpha = 0.7;
    x.fillStyle = trace;
    x.beginPath(); x.arc(snap(rnd() * px), snap(rnd() * px), W * 1.3, 0, Math.PI * 2); x.fill();
  }
  x.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

/* ----------------------------------------------------------- the pyramid
   Far out beyond the bank, in the Amenti manner: the body translucent and
   low-contrast so it reads as distance rather than as an object, its edges
   picked out in burnished gold, and the capstone detached — floating a gap
   above the truncated apex, turning slowly and catching more light than
   anything else in the scene.

   Fog is off for all of it. At this distance the fog would erase it, and the
   haze is in the material instead, which is how the game handles its own
   backdrop. */
const PY_H = 132, PY_R = 150, PY_Z = -430;
const pyramid = new THREE.Group();
pyramid.position.set(0, 0, PY_Z);

const bodyGeo = new THREE.ConeGeometry(PY_R, PY_H, 4, 1, true);
/* the faces are a smooth gradient, not a board: the etching read as noise at
   this distance and fought the silhouette. Dense at the base, thinning as it
   rises, so the pyramid dissolves towards its own apex and the capstone is
   the one solid thing up there. */
function pyramidGradient() {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.00, '#f2f7f8');      // apex, nearly sky
  g.addColorStop(0.35, '#dae8ec');
  g.addColorStop(0.72, '#c4d8de');
  g.addColorStop(1.00, '#a9c4cd');      // base, where it meets the water
  x.fillStyle = g;
  x.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const pyTex = pyramidGradient();
const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({
  map: pyTex,
  color: 0xffffff, transparent: true, opacity: 0.32, depthWrite: false,
  fog: false, side: THREE.DoubleSide, roughness: 0.9, metalness: 0.0,
  emissive: 0xbcd4dc, emissiveIntensity: 0.12 }));
body.rotation.y = Math.PI / 4;                   // a face towards the viewer
body.position.y = PY_H / 2;
body.renderOrder = -52;
pyramid.add(body);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(bodyGeo),
  new THREE.LineBasicMaterial({ color: 0xb89a4e, transparent: true,
    opacity: 0.40, depthWrite: false, fog: false }));
edges.rotation.y = Math.PI / 4;
edges.position.y = PY_H / 2;
edges.renderOrder = -51;
pyramid.add(edges);

/* the capstone, floating clear of the apex */
/* Smaller, and sitting closer to the apex. At 17 per cent of the pyramid's
   width, with a halo seven times its own radius, it read as a separate
   object floating in front of the scene rather than the stone off the top
   of that pyramid. */
const CAP_R = PY_R * 0.0525, CAP_H = PY_H * 0.0575, CAP_GAP = PY_H * 0.03;
/* The capstone is a group, not a single cone. A cone's base cap was either
   missing or invisible from below, so the stone read as a hollow shell with
   a bright rim and the sky showing through it. This way the four faces and
   the base are separate meshes, and the base is definitely there: a square
   plane turned to face straight down, dark, lit by nothing. */
const capFaceMat = new THREE.MeshStandardMaterial({
  color: 0xe8c463, roughness: 0.22, metalness: 0.9,
  emissive: 0x6b4f14, emissiveIntensity: 0.55, fog: false });
const capBaseMat = new THREE.MeshBasicMaterial({
  color: 0x140e07, fog: false });          // flat black-brown: its own shadow

const capstone = new THREE.Group();
const capCone = new THREE.Mesh(
  new THREE.ConeGeometry(CAP_R, CAP_H, 4, 1, true), capFaceMat);   // open; the base is its own mesh
capstone.add(capCone);
const capBase = new THREE.Mesh(
  new THREE.PlaneGeometry(CAP_R * Math.SQRT2, CAP_R * Math.SQRT2), capBaseMat);
/* A cone with four segments puts its base corners at 0, 90, 180 and 270
   degrees; a plane puts its corners at 45 between those. Spinning the square
   a further 45 in its own plane brings the two into register. */
capBase.rotation.set(Math.PI / 2, 0, Math.PI / 4);
capBase.position.y = -CAP_H / 2 + 0.01;    // sit flush under the faces
capstone.add(capBase);
capstone.rotation.y = Math.PI / 4;
capstone.position.y = PY_H + CAP_GAP + CAP_H / 2;
capstone.renderOrder = -50;
pyramid.add(capstone);
const capEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(capCone.geometry),
  new THREE.LineBasicMaterial({ color: 0xffe6a0, transparent: true, opacity: 0.75,
    depthWrite: false, fog: false }));
capEdges.rotation.y = Math.PI / 4;
capEdges.position.copy(capstone.position);
capEdges.renderOrder = -49;
pyramid.add(capEdges);
/* a halo behind it, so the gold has something to sit in */
function haloTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 4, 64, 64, 64);
  g.addColorStop(0.00, 'rgba(255,232,168,.85)');
  g.addColorStop(0.28, 'rgba(255,214,120,.30)');
  g.addColorStop(0.62, 'rgba(255,200,96,.08)');
  g.addColorStop(1.00, 'rgba(255,200,96,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: haloTexture(), transparent: true, depthWrite: false, depthTest: false,
  blending: THREE.AdditiveBlending, opacity: 0.8, fog: false }));
halo.scale.setScalar(CAP_R * 3.4);
/* centred on the stone, the halo bled under it and lit the very face that
   should be in shadow. Sitting it slightly high keeps the glow above. */
halo.position.copy(capstone.position);
halo.position.y += CAP_H * 0.45;
halo.renderOrder = -53;
pyramid.add(halo);
pyramid.userData.halo = halo;

/* the beacon: a shaft of light standing straight up out of the capstone,
   bright where it leaves the gold and gone by the top. Additive, so it adds
   to the sky rather than covering it, and drawn without writing depth so the
   sky and the capstone both read through it. */
function beamTexture() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 256, 0, 0);       // base at the bottom
  g.addColorStop(0.00, 'rgba(255,238,190,.95)');
  g.addColorStop(0.12, 'rgba(255,224,150,.55)');
  g.addColorStop(0.45, 'rgba(255,214,120,.18)');
  g.addColorStop(0.78, 'rgba(255,206,110,.05)');
  g.addColorStop(1.00, 'rgba(255,206,110,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const BEAM_H = PY_H * 2.0;
const beam = new THREE.Mesh(
  /* CylinderGeometry takes the TOP radius first: narrow above, wider where it
     leaves the capstone, so the shaft tapers to a point in the sky. */
  new THREE.CylinderGeometry(CAP_R * 0.03, CAP_R * 0.18, BEAM_H, 12, 1, true),
  new THREE.MeshBasicMaterial({ map: beamTexture(), transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    fog: false, opacity: 0.85 }));
beam.position.y = capstone.position.y + CAP_H / 2 + BEAM_H / 2;
beam.renderOrder = -53;
pyramid.add(beam);
pyramid.userData.beam = beam;

pyramid.userData.cap = capstone;
pyramid.userData.capEdges = capEdges;
pyramid.userData.capY = capstone.position.y;
scene.add(pyramid);

/* ------------------------------------------------------------------- mist
   Banks lying on the water: wide, very soft sprites drifting at different
   depths and speeds, plus a thin band along the horizon that thickens and
   thins. They pass in front of the ships and behind them, so the fleet sits
   IN the air rather than against a backdrop, and they take the colour of
   whatever the sky is doing. Eight quads and one texture. */
function mistTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  for (let i = 0; i < 46; i++) {
    const px = Math.random() * 256, py = 28 + (Math.random() - 0.5) * 34;
    const r = 18 + Math.random() * 54;
    const g = x.createRadialGradient(px, py, 1, px, py, r);
    g.addColorStop(0.00, 'rgba(255,255,255,.085)');
    g.addColorStop(0.55, 'rgba(255,255,255,.035)');
    g.addColorStop(1.00, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.beginPath(); x.ellipse(px, py, r, r * 0.42, 0, 0, Math.PI * 2); x.fill();
  }
  const fade = x.createLinearGradient(0, 0, 0, 64);   // no straight edges
  fade.addColorStop(0.00, 'rgba(0,0,0,1)');
  fade.addColorStop(0.30, 'rgba(0,0,0,0)');
  fade.addColorStop(0.72, 'rgba(0,0,0,0)');
  fade.addColorStop(1.00, 'rgba(0,0,0,1)');
  x.globalCompositeOperation = 'destination-out';
  x.fillStyle = fade;
  x.fillRect(0, 0, 256, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

const mistTex = mistTexture();
const MIST = [];
for (let i = 0; i < 7; i++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(260 + i * 46, 16 + (i % 3) * 7),
    new THREE.MeshBasicMaterial({ map: mistTex.clone(), transparent: true, depthWrite: false,
      fog: false, opacity: 0 }));
  m.material.map.needsUpdate = true;
  m.material.map.repeat.set(1.4 + i * 0.2, 1);
  m.material.map.offset.x = Math.random();
  m.position.set(0, 1.5 + (i % 3) * 2.4, 40 - i * 26);
  m.renderOrder = 3;
  m.userData = { drift: (i % 2 ? 1 : -1) * (0.004 + i * 0.0016),
                 puff: 0.7 + i * 0.37, base: 0.30 + (i % 3) * 0.12 };
  scene.add(m);
  MIST.push(m);
}
const horizonMist = new THREE.Mesh(new THREE.PlaneGeometry(2200, 26),
  new THREE.MeshBasicMaterial({ map: mistTex.clone(), transparent: true, depthWrite: false,
    fog: false, opacity: 0 }));
horizonMist.material.map.repeat.set(8, 1);
horizonMist.position.set(0, 5, -520);
horizonMist.renderOrder = 2;
horizonMist.userData = { drift: 0.0015, puff: 0.31, base: 0.5 };
scene.add(horizonMist);
MIST.push(horizonMist);

/* ================================================== the fleet, in formation
   A shallow V with its point towards the viewer, every bow turned to face
   the camera. This is the wedge the game holds before the first move. */
/* A chevron opening away from the viewer rather than a closed V: the two
   lead ships abreast, the outer pair set back and wider. Nothing stands
   behind anything, so all four sails read at once. */
/* A chevron opening away from the viewer rather than a closed V: the two
   lead ships abreast, the outer pair set back and wider. Nothing stands
   behind anything, so all four sails read at once. */
/* A wedge with its point towards the viewer: Amenti leads, the other two
   sit back on either quarter. Nothing stands behind anything. */
/* A wedge with its point towards the viewer: Amenti leads, GannLab and
   Treasure Chess sit back on either quarter, and two more stand further out
   again on the wings, smaller with distance. */
const FORMATION = [
  { x:   0, z:   6 },   // Amenti, the lead ship
  { x: -26, z: -16 },   // GannLab
  { x:  26, z: -16 },   // Treasure Chess
  { x: -56, z: -42 },   // X, far out on the left wing
  { x:  56, z: -42 }    // Amenti.live, far out on the right wing
];
const ships = [];
PROJECTS.forEach((p, i) => {
  const s = buildShip(p);
  s.position.set(FORMATION[i].x, 0, FORMATION[i].z);
  s.userData.project = p;
  s.userData.home = s.position.clone();
  s.userData.phase = i * 1.7;
  scene.add(s);
  ships.push(s);
});

/* ------------------------------------------------------- the reflections
   Each ship gets a mirrored twin under the surface: the same geometry with
   its Y flipped, drawn before the water and without writing depth, so the
   sea lies over it. Two shared materials rather than a copy of all
   forty-three — a reflection in moving water is a smear of tone, not a
   second ship, and this way three reflections cost two materials.

   The twin stretches and slides a little on the swell, which is what sells
   it: a still reflection under moving water looks painted on. */
/* A reflection dims as it goes down and gives out well before the mast would
   reach: chop breaks the far end of it up long before that. So the twin is
   foreshortened, faded with depth in the shader, and clipped hard at the
   point where there would be nothing left to see anyway. */
const REF_FLOOR = 9;                       // how deep a reflection survives
renderer.localClippingEnabled = true;
const refClip = new THREE.Plane(new THREE.Vector3(0, 1, 0), REF_FLOOR);

function fadeWithDepth(mat) {
  mat.onBeforeCompile = shader => {
    shader.vertexShader = 'varying float vDepthY;\n' + shader.vertexShader
      .replace('#include <begin_vertex>',
               '#include <begin_vertex>\n  vDepthY = (modelMatrix * vec4(position, 1.0)).y;');
    shader.fragmentShader = 'varying float vDepthY;\n' + shader.fragmentShader
      .replace('#include <dithering_fragment>',
               '#include <dithering_fragment>\n  gl_FragColor.a *= clamp(1.0 + vDepthY / ' +
               REF_FLOOR.toFixed(1) + ', 0.0, 1.0);');
  };
  return mat;
}

const refDark = fadeWithDepth(new THREE.MeshBasicMaterial({ color: 0x1b2a33, transparent: true,
  opacity: 0.40, depthWrite: false, fog: true, clippingPlanes: [refClip] }));
const refPale = fadeWithDepth(new THREE.MeshBasicMaterial({ color: 0xdfe8ea, transparent: true,
  opacity: 0.30, depthWrite: false, fog: true, clippingPlanes: [refClip] }));

for (const ship of ships) {
  const twin = ship.clone(true);
  /* the reflection carries the craft's own colour rather than a shared grey:
     five accents in the water, one under each ship */
  const tint = new THREE.MeshBasicMaterial({
    color: new THREE.Color(ship.userData.project.neon || 0x35e6ff).multiplyScalar(0.55),
    transparent: true, opacity: 0.30, depthWrite: false, fog: true,
    clippingPlanes: [refClip] });
  fadeWithDepth(tint);
  twin.traverse(o => {
    if (!o.isMesh) return;
    o.material = (o.material && o.material.map) ? refPale : tint;
    o.renderOrder = 0;
    o.castShadow = o.receiveShadow = false;
  });
  twin.scale.y = -0.55;                    // mirrored and foreshortened
  twin.userData.of = ship;
  scene.add(twin);
  ship.userData.twin = twin;
}

fitCamera();
camera.position.copy(CAM_HOME);

/* ============================================================= interaction */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let hovered = null, chosen = null, dragging = false, px = 0, py = 0, yaw = 0, pitch = 0;

function shipUnder(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  ptr.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(ships, true)[0];
  if (!hit) return null;
  let o = hit.object;
  while (o && !o.userData.project) o = o.parent;
  return o || null;
}

renderer.domElement.addEventListener('pointermove', ev => {
  if (dragging) {
    yaw = Math.max(-0.5, Math.min(0.5, yaw - (ev.clientX - px) * 0.0025));
    pitch = Math.max(-0.1, Math.min(0.32, pitch + (ev.clientY - py) * 0.0015));
    px = ev.clientX; py = ev.clientY;
    return;
  }
  const s = shipUnder(ev);
  if (s !== hovered) {
    hovered = s;
    cardFor(s);                                  // the card follows the pointer
    renderer.domElement.style.cursor = s ? 'pointer' : 'grab';
  }
  if (s) {
    tip.textContent = s.userData.project.title.toUpperCase();
    tip.style.left = ev.clientX + 'px';
    tip.style.top = ev.clientY + 'px';
    tip.classList.add('on');
  } else tip.classList.remove('on');
});
renderer.domElement.addEventListener('pointerdown', ev => {
  dragging = true; px = ev.clientX; py = ev.clientY;
  if (renderer.domElement.setPointerCapture) renderer.domElement.setPointerCapture(ev.pointerId);
});
renderer.domElement.addEventListener('pointerup', ev => {
  dragging = false;
  if (Math.abs(ev.clientX - px) + Math.abs(ev.clientY - py) < 6) {
    const s = shipUnder(ev);
    if (s) choose(s); else release();
  }
});
renderer.domElement.addEventListener('pointerleave', () => {
  dragging = false; tip.classList.remove('on');
  if (hovered) { hovered = null; cardFor(null); }
});

/* The card follows the mouse rather than a click: point at a ship and it
   rises, leave the fleet and it drops again. Clicking still holds a ship —
   it comes forward and stays out while you read, and the card then stays up
   even when the mouse wanders off. */
function fillCard(p) {
  document.getElementById('cardKind').textContent = p.kind;
  document.getElementById('cardTitle').textContent = p.title;
  document.getElementById('cardBlurb').textContent = p.blurb;
  if (p.url) {
    cardGo.href = p.url; cardGo.textContent = 'Open ' + p.title;
    cardGo.removeAttribute('aria-disabled');
  } else {
    cardGo.href = '#'; cardGo.textContent = 'Not yet launched';
    cardGo.setAttribute('aria-disabled', 'true');
  }
  card.classList.add('up');
  card.setAttribute('aria-hidden', 'false');
  hint.classList.add('gone');
}
function hideCard() {
  card.classList.remove('up');
  card.setAttribute('aria-hidden', 'true');
}
/* dropping the card is delayed a moment, so crossing a gap between two ships
   does not make it flicker */
let dropTimer = null;
function cardFor(s) {
  if (dropTimer) { clearTimeout(dropTimer); dropTimer = null; }
  if (s) { fillCard(s.userData.project); return; }
  if (chosen) return;                       // a held ship keeps its card
  dropTimer = setTimeout(() => { if (!chosen) hideCard(); dropTimer = null; }, 260);
}
function choose(s) {
  if (chosen === s) { release(); return; }
  chosen = s;
  fillCard(s.userData.project);
}
function release() {
  chosen = null;
  cardFor(hovered);                         // fall back to whatever is hovered
}

const dots = [...document.querySelectorAll('#views .dot')];
function setView(n) {
  if (n === view) return;
  view = n;
  viewSince = clock.getElapsedTime();
  for (const o of dots) o.setAttribute('aria-pressed', String(+o.dataset.view === view));
  fitCamera();
  hint.classList.add('gone');
}
for (const d of dots) {
  d.setAttribute('aria-pressed', String(+d.dataset.view === view));
  d.addEventListener('click', () => setView(+d.dataset.view));
}

/* the stamp: where this sky is drawn from, and the local hour it is drawn
   for. Refreshed every few seconds, and again if the browser offers a
   position after the fact. */
const stampEl = document.getElementById('stamp');
function stampPlace() {
  const now = new Date();
  const sa = sunAngles(now, place.lat, place.lon);
  const ph = moonPhaseNow(now);
  const names = ['new', 'waxing crescent', 'first quarter', 'waxing gibbous',
                 'full', 'waning gibbous', 'last quarter', 'waning crescent'];
  const phaseName = names[Math.round(ph * 8) % 8];
  stampEl.textContent =
    `${place.name} · ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · ` +
    `sun ${sa.alt > 0 ? sa.alt.toFixed(0) + '° up' : 'below the horizon'} · moon ${phaseName}`;
}
stampPlace();
setInterval(stampPlace, 5000);

document.getElementById('cardBack').addEventListener('click', release);
cardGo.addEventListener('click', e => { if (cardGo.getAttribute('aria-disabled') === 'true') e.preventDefault(); });
addEventListener('keydown', e => { if (e.key === 'Escape') release(); });
function resize() {
  const { w, h } = viewport();
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  fitCamera();
}
addEventListener('resize', resize);
resize();

/* ================================================================== render */
/* the sail's half height, worked out once per geometry */
function clothHalf(g) {
  if (g.userData.half === undefined) {
    g.computeBoundingBox();
    g.userData.half = g.boundingBox.max.y;
  }
  return g.userData.half;
}

const clock = new THREE.Clock();
let lastW = 0, lastH = 0, lastSky = -1, skyBand = [230, 223, 201], drama = 0;
function frame() {
  const t = clock.getElapsedTime();

  const { w, h } = viewport();                       // a pane sized after load
  if (w !== lastW || h !== lastH) { lastW = w; lastH = h; resize(); }

  /* the sky warms and cools on a ninety-second cycle. Repainted at about
     eight frames a second, which is smooth at this speed and costs almost
     nothing; the fog and the key light follow it so the whole scene turns
     together rather than the sky changing behind a cold sea. */
  /* the sun's arc: theta 0 at sunrise behind the viewer, PI at sunset behind
     the pyramid. Everything else is read off its altitude. */
  /* Time is warped so the sun spends about seventy per cent of the cycle
     above the horizon and hurries through the night: an even split left the
     page dark half the time it was open. */
  /* The page opens at noon — the bright blue the scene started life in —
     and works round to dusk, night, dawn and back to blue. Opening on a
     sunrise meant the first thing anyone saw was the warm phase. */
  /* a dot holds the sky at one point in the day; with none pressed the day
     simply runs. The ships, the swell and the capstone keep their own time
     either way — only the sun is held. */
  /* Each view decides what the sun is doing. A view with `from` set starts
     the day at that point and runs it at its own rate, stopping at `until`
     if it has one; a view with none simply lets the day run. */
  const V = VIEWS[view];
  let dayTime = t;
  let realSky = false, realAlt = 0, realAz = 180, realPhase = 0.5, realMoon = null;
  if (V.live) {
    const now = new Date();
    const sa = sunAngles(now, place.lat, place.lon);
    realSky = true; realAlt = sa.alt; realAz = sa.az;
    realPhase = moonPhaseNow(now);
    realMoon = moonPosition(now, place.lat, place.lon);
    realPhase = realMoon.phase;              // phase and position from one geometry
  }
  if (V.from !== null) {
    const elapsed = (t - viewSince) * V.rate;
    dayTime = (V.from + elapsed / DAY) * DAY;
    if (V.until !== undefined) dayTime = Math.min(dayTime, V.until * DAY);
  }
  const phase = (dayTime / DAY + 0.25) % 1;
  const warped = phase < 0.70 ? (phase / 0.70) * 0.5 : 0.5 + ((phase - 0.70) / 0.30) * 0.5;
  /* ease the sun through the horizon: it hangs there, the way a real sunset
     takes its time and then the light goes quickly once it is under. */
  const raw = warped * Math.PI * 2;
  let theta = raw - Math.sin(raw * 2) * 0.28;
  if (realSky) theta = Math.asin(Math.max(-1, Math.min(1, realAlt / 90)));   // altitude drives it
  let alt = Math.sin(theta);                        // -1 under, +1 overhead
  let sunPos;
  if (realSky) {
    /* east is +Z, because the pyramid's east face is the one turned towards
       the viewer; north is -X. The sun then rises and sets where it really
       does for this place at this hour. */
    alt = Math.sin(realAlt * Math.PI / 180);
    const azr = realAz * Math.PI / 180, ar = realAlt * Math.PI / 180;
    sunPos = new THREE.Vector3(
      -Math.cos(azr) * Math.cos(ar) * SUN_DIST,
      Math.sin(ar) * SUN_DIST,
      Math.sin(azr) * Math.cos(ar) * SUN_DIST);
  } else {
    sunPos = new THREE.Vector3(
      -Math.sin(theta) * SUN_DIST * 0.30,
      alt * SUN_DIST * 0.62,
      Math.cos(theta) * SUN_DIST);
  }
  sun.position.copy(sunPos);
  sunSprite.position.copy(sunPos);
  sunSprite.material.opacity = Math.max(0, Math.min(1, (alt + 0.12) * 3));
  /* the disc goes from white overhead to deep orange on the horizon */
  const low = Math.max(0, 1 - Math.max(0, alt) / 0.5);
  sunSprite.material.color.setRGB(1, 1 - low * 0.30, 1 - low * 0.62);
  sunSprite.scale.setScalar(150 + Math.max(0, 1 - Math.abs(alt) * 3) * 130);   // swollen at the horizon

  /* The canvas is only repainted a few times a second — it is a paint job and
     eight frames is plenty. Everything else keyed to the sun is updated every
     frame, because the sun moves every frame and a sea that catches up an
     eighth of a second later reads as lagging behind the sky. */
  drama += ((VIEWS[view].drama || 0) - drama) * 0.04;      // eased, so the dots do not snap
  if (t - lastSky > 0.125) {
    lastSky = t;
    skyBand = paintSky(alt, drama);
    sky.needsUpdate = true;
    sky.dispose();                    // drop the cached cubemap so reflections follow too
    scene.environment = sky;
  }
  renderer.toneMappingExposure = 1.12 + drama * 0.10;

  const lift = Math.max(0, alt);                   // 0 at the horizon, 1 overhead
  const dusk = Math.max(0, 1 - Math.abs(alt) / 0.62);
  const bandCol = new THREE.Color(skyBand[0] / 255, skyBand[1] / 255, skyBand[2] / 255);

  scene.fog.color.copy(bandCol);
  sun.intensity = 0.12 + lift * 1.4;
  sun.color.setRGB(1, 0.70 + lift * 0.26, 0.44 + lift * 0.46);   // red low, white high
  hemi.intensity = 0.42 + lift * 0.85;
  hemi.color.copy(bandCol).lerp(new THREE.Color(0xdfefff), lift);

  /* the sails carry the names, so they are lit from within as the light
     fails: barely at noon, strongly once the sun is under */
  const cloth = 0.18 + (1 - lift) * 0.62;
  for (const sh of ships) if (sh.userData.sailMat) sh.userData.sailMat.emissiveIntensity = cloth;

  /* the sea is mixed from its own blue, darkened by how low the sun is, and
     tinted towards whatever the horizon is doing — which is what makes a
     sunset sea go copper rather than staying blue under a pink sky */
  const deep = new THREE.Color(0x2e8fb4).multiplyScalar(0.30 + lift * 0.78);
  water.material.color.copy(deep).lerp(bandCol.clone().multiplyScalar(0.62), dusk * 0.42);
  water.material.envMapIntensity = 0.55 + lift * 0.65;

  /* the procession: each body sits further back along the sun's arc, and
     shows only once the sky is dark enough and it has risen */
  /* the Moon works its way round: one full round of phases every eight days,
     which is quick enough to notice and slow enough not to strobe */
  const MOON_MONTH = 8;
  /* The phase is always tonight's real one, in every view. It used to run on
     a synthetic cycle whenever the view was not the live sky, so the stamp
     could read "full" while the glyph drew a quarter — two clocks for one
     moon. Only its POSITION falls back to the arc when the sky is scripted. */
  const moonPhase = moonPhaseNow(new Date());
  const moonLag = moonPhase * Math.PI * 2;
  if (Math.abs(moonPhase - lastMoonPhase) > 0.004) {
    lastMoonPhase = moonPhase;
    paintMoon(moonPhase);
    moonTex.needsUpdate = true;
  }

  for (const pl of PLANETS) {
    if (pl.moon && realMoon) {
      /* the real Moon: its own altitude and azimuth, on the same compass as
         the sun — east is +Z, north is -X */
      const ar = realMoon.alt * Math.PI / 180;
      pl.sprite.position.set(
        -Math.cos(realMoon.az) * Math.cos(ar) * SUN_DIST,
        Math.sin(ar) * SUN_DIST,
        Math.sin(realMoon.az) * Math.cos(ar) * SUN_DIST);
      const risen = Math.max(0, Math.min(1, Math.sin(ar) * 6));
      const dark = Math.max(0, Math.min(1, (0.55 - alt) * 2.2));
      pl.sprite.material.opacity = risen * dark * pl.mag;
      const ms = pl.sprite.position.clone().project(camera);
      const ss = sunPos.clone().project(camera);
      pl.sprite.material.rotation = Math.atan2(ss.y - ms.y, ss.x - ms.x) - Math.PI / 2;
      continue;
    }
    const th = theta - (pl.moon ? moonLag : pl.lag);
    const a = Math.sin(th);
    pl.sprite.position.set(
      -Math.sin(th) * SUN_DIST * 0.30 + Math.sin(th * 2) * SUN_DIST * pl.tilt * 0.35,
      a * SUN_DIST * 0.62 + pl.tilt * SUN_DIST * 0.06,
      Math.cos(th) * SUN_DIST);
    const risen = Math.max(0, Math.min(1, a * 6));          // above the horizon
    const dark = pl.moon
      ? Math.max(0, Math.min(1, (0.55 - alt) * 2.2))     // the Moon shows in a bright sky too
      : Math.max(0, Math.min(1, (0.18 - alt) * 3.2));    // the planets need it dim
    pl.sprite.material.opacity = risen * dark * pl.mag;
    if (pl.moon) {
      /* point the lit side at the sun, in screen terms */
      const ms = pl.sprite.position.clone().project(camera);
      const ss = sunPos.clone().project(camera);
      pl.sprite.material.rotation = Math.atan2(ss.y - ms.y, ss.x - ms.x) - Math.PI / 2;
    }
  }

  for (const m of MIST) {                          // drift, breathe, take the sky's colour
    const u = m.userData;
    m.material.map.offset.x += u.drift * 0.016;
    const breathe = 0.55 + 0.45 * Math.sin(t * 0.055 * u.puff + u.puff * 3);
    m.material.opacity = u.base * breathe * (0.55 + dusk * 0.5);
    m.material.color.copy(bandCol).lerp(new THREE.Color(0xffffff), 0.45);
  }

  /* the glitter track lies between the viewer and the sun, and only when the
     sun is low enough to lay one */
  const lowSun = Math.max(0, 1 - Math.abs(alt) * 2.2) * Math.max(0, Math.sign(sunPos.z) * 0.5 + 0.5);
  glitter.material.opacity = lowSun * 0.7;
  if (lowSun > 0.01) {
    glitter.position.x = sunPos.x * 0.12;
    glitter.position.z = -60;
    glitter.rotation.z = Math.atan2(sunPos.x, -sunPos.z) * 0.4;
  }

  const a = waterGeo.attributes.position.array;        // the swell
  for (let i = 0; i < a.length; i += 3) {
    const x = waterBase[i], y = waterBase[i + 1];
    a[i + 2] = Math.sin(x * 0.05 + t * 0.7) * 0.55
             + Math.cos(y * 0.07 - t * 0.5) * 0.4
             + Math.sin((x + y) * 0.16 + t * 1.5) * 0.14;   // near-field chop
  }
  waterGeo.attributes.position.needsUpdate = true;
  waterNrm.offset.set(t * 0.012, t * 0.02);            // the chop drifts

  for (const s of ships) {                             // every ship rides it
    const ph = s.userData.phase, home = s.userData.home;
    const lift = (s === hovered ? 0.5 : 0) + (s === chosen ? 1.1 : 0);
    /* hovering brings a ship out of the line and lifts the thread, so the
       sail is both nearer and brighter while you read it */
    const want = (s === hovered ? 1 : 0);
    s.userData.near = (s.userData.near || 0) + (want - (s.userData.near || 0)) * 0.08;
    s.userData.sailMat.emissiveIntensity = 0.85 + s.userData.near * 0.75;
    /* the cloth working: two travelling waves across it plus a slow belly,
       all scaled by how far down the sail a vertex sits, so the head stays
       laced to the yard and the foot does the moving */
    const cl = s.userData.cloth;
    if (cl) {
      const g = cl.geometry, rest = g.userData.rest, pos = g.attributes.position;
      const hHalf = clothHalf(g);
      for (let i = 0; i < pos.count; i++) {
        const rx = rest[i * 3], ry = rest[i * 3 + 1];
        const loose = Math.min(1, (hHalf - ry) / (hHalf * 2));     // 0 at the head, 1 at the foot
        const w = Math.sin(rx * 0.9 - t * 2.1 + ph) * 0.42
                + Math.sin(rx * 1.9 + ry * 0.7 - t * 3.3 + ph * 1.7) * 0.18
                + Math.sin(t * 0.8 + ph) * 0.3;                    // the belly
        /* one-sided: the cloth always bellies away from the spar, never
           back through it, so the wave travels without the mast appearing */
        pos.setZ(i, (0.5 + w * 0.5) * loose * loose);
      }
      pos.needsUpdate = true;
      g.computeVertexNormals();
    }

    if (s.userData.neonMats) {                     // a slow throb, brighter on hover
      const beatN = 0.72 + 0.28 * Math.sin(t * 1.15 + ph * 2.1);
      s.userData.neonMats[0].opacity = (0.55 + s.userData.near * 0.4) * beatN;
      s.userData.neonMats[1].opacity = (0.18 + s.userData.near * 0.22) * beatN;
    }
    /* ------------------------------------------------- station keeping
       Each craft wanders around its own place in the formation on three
       slow cycles that never line up, so the drift never repeats. It is
       then pushed away from any neighbour that comes too close, and the
       whole wander is damped to nothing while the mouse is on the fleet —
       so pointing at a ship settles the formation rather than chasing a
       moving target. */
    const calm = Math.max(s.userData.near || 0, hovered ? 0.75 : 0, chosen ? 1 : 0);
    const wander = 1 - calm;
    s.userData.calm = calm;
    const wx = (Math.sin(t * 0.21 + ph * 1.7) * 3.4 + Math.sin(t * 0.09 + ph) * 2.2) * wander;
    const wy = (Math.sin(t * 0.27 + ph * 2.3) * 1.5 + Math.sin(t * 0.13 + ph * 0.6) * 0.9) * wander;
    const wz = Math.sin(t * 0.17 + ph * 1.1) * 2.6 * wander;
    s.userData.drift = { x: wx, y: wy, z: wz };

    /* a proper sea state: heave on two periods so it never repeats cleanly,
       roll, pitch, a slow yaw as the hull hunts around its anchor, and a
       surge back and forth along its own length. */
    const heave = Math.sin(t * 0.9 + ph) * 0.42 + Math.sin(t * 0.37 + ph * 1.7) * 0.22;
    /* it hovers: the resting height is well clear of the water, and the
       heave is the craft holding station on its field rather than a hull
       riding a swell. */
    const ride = (s.userData.hoverH || 4.4);
    s.position.y += ((ride + heave * 0.55 + lift + wy) - s.position.y) * 0.06;
    /* the pool of light it throws on the sea, which stays on the water while
       the craft rises and falls above it, and dims as it climbs */
    if (s.userData.pool) {
      const pl = s.userData.pool;
      if (!pl.parent) scene.add(pl);
      pl.position.set(s.position.x, 0.12, s.position.z);
      const gap = Math.max(0.1, s.position.y);
      const spread = 1 + gap * 0.055;
      pl.scale.set(spread * 1.35, 0.62 * spread, spread * 1.35);
      /* brighter, and it wavers with the swell, so the accent colour is
         clearly in the water rather than painted under the hull */
      const flicker = 0.86 + 0.14 * Math.sin(t * 2.3 + ph * 1.9);
      pl.material.opacity = (0.72 / spread) * flicker;
    }
    if (s.userData.thrusters) {                    // the wash under the keel
      const th = 0.6 + 0.4 * Math.sin(t * 3.1 + ph * 2);
      for (let k = 0; k < s.userData.thrusters.length; k++) {
        const sp = s.userData.thrusters[k];
        sp.material.opacity = 0.45 + th * 0.4;
        sp.scale.setScalar((s.userData.len * 0.055) * (2.4 + th * 0.5));
      }
    }
    s.rotation.z = Math.sin(t * 0.7 + ph) * 0.075 + Math.sin(t * 0.23 + ph) * 0.03;   // roll
    s.rotation.x = Math.cos(t * 0.55 + ph) * 0.045;                                    // pitch
    s.rotation.y = Math.PI / 2 + Math.sin(t * 0.19 + ph * 0.6) * 0.07;                 // yaw
    const twin = s.userData.twin;
    if (twin) {
      twin.position.set(s.position.x, -s.position.y * 0.92, s.position.z);
      twin.rotation.set(-s.rotation.x, s.rotation.y, -s.rotation.z);
      /* the swell stretches and shears it */
      twin.scale.set(1 + Math.sin(t * 1.1 + ph) * 0.03,
                     -(0.55 + Math.sin(t * 0.8 + ph) * 0.05),
                     1);
      twin.position.x += Math.sin(t * 1.4 + ph) * 0.25;
    }

    /* Hovering brings a ship five of its own lengths forward — enough that
       the sail fills a good part of the frame and the embroidery can be
       read. Clamped so it can never arrive in the camera's lap: it stops a
       clear 34 units short of the eye. */
    const reach = (s.userData.len || 15) * 5;
    const wanted = (s === chosen ? 24 : 0) + s.userData.near * reach;
    const room = Math.max(0, CAM_HOME.z - 34 - home.z);
    const tz = home.z + Math.min(wanted, room) + wz;
    const tx = home.x + (s === chosen ? -home.x * 0.25 : 0) + wx;
    s.position.z += (tz - s.position.z) * 0.045;
    s.position.x += (tx - s.position.x) * 0.045;
    s.position.x += Math.sin(t * 0.31 + ph) * 0.06;        // slow sideways set
    s.position.z += Math.sin(t * 0.44 + ph * 1.3) * 0.05;  // surge
  }

  /* the capstone drifts and turns, slowly enough to notice only on a second
     look, which is the point of it */
  const capY = pyramid.userData.capY + Math.sin(t * 0.25) * 2.2;
  pyramid.userData.cap.position.y = capY;
  /* one turn every twenty seconds or so: slow enough to be calm, quick
     enough that the gold catches a new face while you are looking at it. */
  pyramid.userData.cap.rotation.y = Math.PI / 4 + t * 0.32;
  pyramid.userData.cap.rotation.z = Math.sin(t * 0.17) * 0.05;   // a slight list
  pyramid.userData.capEdges.position.y = capY;
  pyramid.userData.capEdges.rotation.y = pyramid.userData.cap.rotation.y;
  pyramid.userData.capEdges.rotation.z = pyramid.userData.cap.rotation.z;
  /* the capstone breathes: two cycles of different length so the pulse never
     settles into an obvious rhythm */
  /* two cycles added rather than multiplied — multiplied, they cancel and the
     capstone barely moves. */
  const beat = 0.5 + 0.34 * Math.sin(t * 0.55) + 0.16 * Math.sin(t * 0.21 + 1.3);
  capFaceMat.emissiveIntensity = 0.42 + beat * 0.55;
  const glow = pyramid.userData.halo;
  glow.position.y = capY + CAP_H * 0.45;
  glow.material.opacity = 0.55 + beat * 0.42;
  glow.scale.setScalar(CAP_R * (3.1 + beat * 0.7));
  /* the shaft rides the same beat, and stands on top of the capstone */
  const bm = pyramid.userData.beam;
  bm.position.y = capY + CAP_H / 2 + BEAM_H / 2;
  bm.material.opacity = 0.55 + beat * 0.45;
  /* the shaft draws in and opens again: full width at the top of the beat,
     a fifth of it at the bottom, on the same cycle as the glow so the beacon
     brightens as it widens. */
  const draw = 0.20 + beat * 0.80;
  bm.scale.set(draw, 1, draw);

  /* keep their distance: any pair closer than a hull length and a half is
     eased apart, along the line between them. Cheap at five craft, and it
     is what stops the wander turning into a collision. */
  const KEEP = 26;
  for (let i = 0; i < ships.length; i++) {
    for (let j = i + 1; j < ships.length; j++) {
      const a = ships[i], b = ships[j];
      const dx = b.position.x - a.position.x, dz = b.position.z - a.position.z;
      const d = Math.hypot(dx, dz);
      if (d > KEEP || d < 0.001) continue;
      const push = (KEEP - d) / KEEP * 0.22 * (1 - Math.max(a.userData.calm || 0, b.userData.calm || 0));
      const ux = dx / d, uz = dz / d;
      a.position.x -= ux * push; a.position.z -= uz * push;
      b.position.x += ux * push; b.position.z += uz * push;
    }
  }

  /* a slow pass across the fleet and a gentle rise and fall, so the scene is
     never quite still even with the mouse untouched. Two periods that do not
     divide into one another, so it never returns to the same place. */
  const driftX = Math.sin(t * 0.043) * CAM_HOME.z * 0.13 + Math.sin(t * 0.017) * CAM_HOME.z * 0.05;
  const driftY = Math.sin(t * 0.031 + 1.3) * CAM_HOME.y * 0.5 + Math.sin(t * 0.011) * CAM_HOME.y * 0.22;

  camera.position.x += ((CAM_HOME.x + driftX + Math.sin(yaw) * CAM_HOME.z * 0.3) - camera.position.x) * 0.05;
  camera.position.y += ((CAM_HOME.y + driftY + (chosen ? 5 : 0) + pitch * 34) - camera.position.y) * 0.05;
  camera.position.z += ((CAM_HOME.z + (chosen ? 14 : 0)) - camera.position.z) * 0.05;
  camera.lookAt(0, CAM_HOME.y * (VIEWS[view].camera.look), chosen ? 8 : 0);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
setTimeout(() => hint.classList.add('gone'), 9000);
</script>
