const BODY_LOOK = {
  Moon:    { color: 0xd8d5cc, radius: 1737 },
  Mercury: { color: 0x9c948a, radius: 2440 },
  Venus:   { color: 0xe6cf9c, radius: 6052 },
  Mars:    { color: 0xc1552f, radius: 3390 },
  Jupiter: { color: 0xd9b48a, radius: 69911 },
  Saturn:  { color: 0xd9c89a, radius: 58232 }
};

function beginJump() {
  if (!craft || !target || flight) return;      // anything is reachable; it only costs
  const wp = target.sprite.getWorldPosition(new THREE.Vector3());
  flight = { t: 0, dur: Math.max(2, Math.min(14, pendingCost)),
             from: camera.position.clone(), bearing: wp.clone().normalize(), body: target.name };
  streaks.visible = true;
  hideCard();
  refreshHud();
}
function finishJump() {
  const name = flight.body;
  const look = BODY_LOOK[name] || BODY_LOOK.Moon;
  arrivalBody.material.color.setHex(look.color);

  /* Put the body where the camera is actually LOOKING, not at a fixed point
     in the world. Parked at a world position, it sat behind you whenever
     you had slewed up to aim at the target — you arrived in orbit facing
     empty space, which read as nothing having happened. */
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  const R = 150;
  arrivalBody.scale.setScalar(R);
  arrivalBody.position.copy(camera.position).addScaledVector(fwd, R * 3.2);
  arrivalBody.visible = true;

  /* and the sea is left behind: you are in orbit, not offshore */
  homeScene(false);
  /* hide the body's own marker in the sky: you are orbiting it, so having
     it still hanging there as a labelled speck gave two Moons */
  for (const pl of PLANETS) {
    const mine = pl.name === name;
    pl.sprite.visible = !mine;
    if (pl.label) pl.label.visible = !mine;
  }

  arrived = { name, km: bodyRangeKm(name, new Date()), radius: look.radius };
  flight = null;
  streaks.visible = false;
  streaks.material.opacity = 0;
  backBtn.hidden = false;
  landBtn.hidden = (name !== 'Moon');
  const km = arrived.km.toLocaleString(undefined, { maximumFractionDigits: 0 });
  const light = arrived.km / 299792.458;
  hudWhy.textContent = `${km} km · light ${light < 90 ? light.toFixed(0) + 's' : (light / 60).toFixed(0) + 'm'}`;
  jumpBtn.disabled = true;
  hudTarget.textContent = name + ' orbit';
}

/* everything that belongs to the bay, shown or hidden in one move */
function homeScene(on) {
  water.visible = on;
  pyramid.visible = on;
  for (const m of MIST) m.visible = on;
  for (const sh of ships) {
    sh.visible = on;
    if (sh.userData.twin) sh.userData.twin.visible = on;
    if (sh.userData.pool) sh.userData.pool.visible = on;
  }
  reticle.visible = on;
}

function goHome() {
  if (onMoon) setMoon(false);
  landBtn.hidden = true;
  arrived = null;
  arrivalBody.visible = false;
  for (const pl of PLANETS) { pl.sprite.visible = true; if (pl.label) pl.label.visible = true; }
  homeScene(true);
  backBtn.hidden = true;
  refreshHud();
}

/* ------------------------------------------------------------- the lock
   Locking picks a body and starts the clock running down to its cheapest
   moment tonight. The lock holds wherever the body goes — under the
   horizon, behind you, into daylight — because position is known whether
   or not it can be seen. What the countdown measures is not permission but
   PRICE: at zero the window is open and the same jump costs least.

   You can always go early. It simply costs more, and the panel says how
   much more while you decide. */
/* The bodies as glyphs along the bottom edge: the old symbols, which are
   the shortest way to say Saturn. Dimmed when a body is under the horizon
   — still reachable, just dearer — lit when it is the target, and dotted
   when it is the cheapest jump on the board. */
const glyphEl = document.getElementById('glyphs');
const glyphBtns = PLANETS.map(pl => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = pl.glyph || '?';
  b.title = pl.name;
  b.setAttribute('aria-label', pl.name);
  /* Each glyph its own colour. Taking the sprite colours and lifting them
     towards white washed them all to the same pale beige — Mars and Saturn
     came out within a few points of each other. These are set apart by hue
     instead, while still being roughly what each body looks like. */
  const UI_HUE = {
    Moon: '#e2edf7', Mercury: '#9fb0bd', Venus: '#ffd166', Mars: '#ff5a3c',
    Jupiter: '#f09048', Saturn: '#e8d27a', Pluto: '#9aa6d6'
  };
  const hue = UI_HUE[pl.name] || '#ffffff';
  b.style.color = hue;
  b.dataset.hue = hue;
  /* hovering a glyph says what it is and how far away it is right now —
     recomputed on the spot, since the distance changes as things orbit */
  b.addEventListener('pointerenter', () => showTip(pl));
  b.addEventListener('pointerleave', hideTip);
  b.addEventListener('focus', () => showTip(pl));
  b.addEventListener('blur', hideTip);
  b.addEventListener('click', () => { target = pl; aimAt(pl); refreshHud(); });
  glyphEl.appendChild(b);
  return { pl, b };
});
const gtip = document.getElementById('gtip');
let tipFor = null;
function showTip(pl) {
  tipFor = pl;
  paintTip();
  gtip.classList.add('on');
}
function hideTip() { tipFor = null; gtip.classList.remove('on'); }
function paintTip() {
  if (!tipFor) return;
  const name = tipFor.real || 'Moon';
  const km = bodyRangeKm(name, new Date());
  const au = km / 149597870.7;
  const alt = (name === 'Moon' ? moonPosition(new Date(), place.lat, place.lon)
                               : planetPosition(name, new Date(), place.lat, place.lon)).alt;
  /* kilometres for the Moon, which is near enough to picture; AU beyond it,
     where the kilometre stops meaning anything */
  const dist = au < 0.02
    ? Math.round(km).toLocaleString() + ' km'
    : au.toFixed(2) + ' au · ' + (km / 1e6).toFixed(0) + 'M km';
  const light = km / 299792.458;
  const lt = light < 90 ? light.toFixed(0) + 's' : (light / 60).toFixed(0) + 'm';
  gtip.innerHTML = `<span>${tipFor.name}${alt > 0 ? '' : ' &middot; down'}</span>` +
                   `<span class="d">${dist} &middot; ${lt}</span>`;
}

function drawGlyphs(cheapName) {
  for (const g of glyphBtns) {
    const up = g.pl.sprite && g.pl.sprite.position.y > 0;
    g.b.classList.toggle('on', target === g.pl);
    g.b.classList.toggle('down', !up);
    g.b.style.color = g.b.dataset.hue;          // the colour survives the state
    g.b.style.opacity = up ? '1' : '.42';
    g.b.classList.toggle('cheap', g.pl.name === cheapName);
  }
}

const lockBtn = document.getElementById('lock');
const hudWindow = document.getElementById('hudWindow');
let locked = null;

function hms(ms) {
  if (ms <= 0) return 'open';
  const s2 = Math.round(ms / 1000);
  const h = Math.floor(s2 / 3600), m = Math.floor((s2 % 3600) / 60), q = s2 % 60;
  return (h ? h + 'h ' : '') + String(m).padStart(h ? 2 : 1, '0') + 'm ' +
         String(q).padStart(2, '0') + 's';
}
function toggleLock() {
  if (locked) { locked = null; lockBtn.classList.remove('armed'); lockBtn.textContent = 'lock on'; }
  else if (target) {
    const drive = craft ? (craft.userData.project.drive || 1) : 1;
    const w = cheapestWindow(target.real || 'Moon', place.lat, place.lon, drive);
    locked = { pl: target, at: w.at, cost: w.cost };
    lockBtn.classList.add('armed');
    lockBtn.textContent = 'release';
    aimAt(target);
  }
  refreshHud();
}
lockBtn.addEventListener('click', toggleLock);

const hudTab = document.getElementById('hudTab');
const hudPanel = document.getElementById('hud');
hudTab.addEventListener('click', () => {
  const away = hudPanel.classList.toggle('away');
  hudTab.classList.toggle('out', away);        // the tab follows the panel's edge
  hudTab.setAttribute('aria-expanded', String(!away));
});

const edgeEl = document.createElement('div');
edgeEl.id = 'edge';
document.body.appendChild(edgeEl);
function edgeMark(pl, inFrame) {
  if (!pl || inFrame) { edgeEl.style.opacity = '0'; return; }
  const w = pl.sprite.getWorldPosition(new THREE.Vector3()).project(camera);
  let x = w.x, y = w.y;
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const to = pl.sprite.getWorldPosition(new THREE.Vector3()).sub(camera.position);
  if (fwd.dot(to) < 0) { x = -x; y = -y; }        // behind: flip to the near edge
  const m = Math.max(Math.abs(x), Math.abs(y)) || 1;
  x /= m; y /= m;
  edgeEl.style.opacity = '.85';
  edgeEl.style.left = ((x * 0.44 + 0.5) * 100) + '%';
  edgeEl.style.top = ((0.5 - y * 0.44) * 100) + '%';
  edgeEl.style.transform = `translate(-50%,-50%) rotate(${Math.atan2(-y, x) * 180 / Math.PI + 90}deg)`;
  edgeEl.textContent = '\u25B2 ' + pl.name.toLowerCase();
}

/* Start crewed and aimed. Both controls used to sit disabled until a ship
   and a body had each been clicked, with nothing on screen saying so — the
   panel looked broken rather than waiting. The lead craft and the nearest
   body are a sensible default, and both can be changed at any time. */
craft = ships[0];
target = PLANETS.find(pl => pl.name === 'Moon') || PLANETS[0];
refreshHud();

/* =================================================== the lunar surface ====
   The same place, somewhere else. The pyramid stands exactly where it does
   at home and the fleet holds the same formation over it — what changes is
   the ground, the sky and the light.

   Regolith rather than water: a wide plate of it, undulating, pocked with
   craters, in the bright grey-white of moon rock. No air, so the sky is
   black to the horizon with the stars still out at noon, the shadows are
   hard, and there is no mist and no glitter track. Earth hangs where the
   sun would be at home.
   ========================================================================= */
const moonGround = (() => {
  const g = new THREE.PlaneGeometry(1600, 1600, 110, 110);
  const pos = g.attributes.position;
  /* craters: each one dents the plate, with a raised rim as a real one has */
  const craters = [];
  for (let i = 0; i < 90; i++)
    craters.push({ x: (Math.random() - 0.5) * 1500, y: (Math.random() - 0.5) * 1500,
                   r: 12 + Math.pow(Math.random(), 2.2) * 120, d: 1.5 + Math.random() * 7 });
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    let z = Math.sin(x * 0.011) * 3.2 + Math.cos(y * 0.008) * 2.6      // long swells
          + Math.sin((x + y) * 0.03) * 0.9;
    for (const c of craters) {
      const d = Math.hypot(x - c.x, y - c.y);
      if (d > c.r * 1.25) continue;
      if (d < c.r) z -= c.d * (1 - Math.pow(d / c.r, 2));              // the bowl
      else z += c.d * 0.35 * (1 - (d - c.r) / (c.r * 0.25));           // the rim
    }
    pos.setZ(i, z);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    map: surfaceTexture(), color: 0xf2f0ea, roughness: 1, metalness: 0,
    envMapIntensity: 0.15 }));
  m.material.map.repeat.set(7, 7);
  m.rotation.x = -Math.PI / 2;
  m.position.y = -1.5;
  m.visible = false;
  scene.add(m);
  return m;
})();

/* Earth, seen from there */
const earthBall = new THREE.Mesh(
  new THREE.SphereGeometry(54, 40, 26),
  new THREE.MeshStandardMaterial({ color: 0x3f6f9e, roughness: 0.85, metalness: 0,
    emissive: 0x16283c, emissiveIntensity: 0.5 }));
earthBall.visible = false;
scene.add(earthBall);

const homeFog = scene.fog;
let onMoon = false;
const landBtn = document.getElementById('land');

/* the pyramid's stone, at home and there */
const STONE_HOME = 0xd8e6ea, STONE_MOON = 0xf6f4ee;

function setMoon(on) {
  onMoon = on;
  moonGround.visible = on;
  earthBall.visible = on;
  arrivalBody.visible = arrived && !on;

  /* the bay's own furniture stays behind; the pyramid and the fleet come */
  water.visible = !on;
  for (const m of MIST) m.visible = !on;
  pyramid.visible = true;
  for (const sh of ships) {
    sh.visible = true;
    if (sh.userData.twin) sh.userData.twin.visible = !on;    // nothing to reflect in
    if (sh.userData.pool) sh.userData.pool.visible = !on;
  }
  reticle.visible = !on;

  /* the stone goes bright, and stops pretending to be hazy distance */
  const body = pyramid.children[0];
  body.material.color.setHex(on ? STONE_MOON : STONE_HOME);
  body.material.opacity = on ? 0.96 : 0.32;
  body.material.roughness = on ? 1 : 0.9;

  /* no air: black sky, hard light, stars at all hours */
  dome.visible = !on;
  scene.background = on ? new THREE.Color(0x05070c) : null;
  scene.fog = on ? null : homeFog;
  starMat.opacity = on ? 0.95 : starMat.opacity;
  sun.intensity = on ? 2.4 : sun.intensity;
  hemi.intensity = on ? 0.12 : hemi.intensity;

  earthBall.position.set(-260, 210, -520);

  /* A lunar day is a month long, so the sun where you land does not follow
     the clock at home. It is put high and off to one side and LEFT there —
     without this, landing at one in the morning put the sun under the
     horizon and the surface was lit by nothing at all, which is exactly
     what an airless world looks like: invisible. */
  if (on) {
    sun.position.set(-620, 520, -260);
    sunSprite.visible = false;
    for (const pl of PLANETS) { pl.sprite.visible = false; if (pl.label) pl.label.visible = false; }
  } else {
    sunSprite.visible = true;
    for (const pl of PLANETS) { pl.sprite.visible = true; if (pl.label) pl.label.visible = true; }
  }

  /* and look out across the ground rather than wherever the jump left the
     eye pointing */
  if (on) { pitch = -0.04; yaw = 0; slew = null; }
  landBtn.textContent = on ? 'orbit' : 'land';
  hudTarget.textContent = on ? 'moon · surface' : (arrived ? arrived.name + ' orbit' : 'none');
}
landBtn.addEventListener('click', () => setMoon(!onMoon));

jumpBtn.addEventListener('click', beginJump);
backBtn.addEventListener('click', goHome);

/* ================================================================== render */
/* the sail's half height, worked out once per geometry */
function clothHalf(g) {
  if (g.userData.half === undefined) {
    g.computeBoundingBox();
    g.userData.half = g.boundingBox.max.y;
  }
  return g.userData.half;
}

const clock = new THREE.Clock();
let hudFrame = 0, pointerOn = false, steady = 0;
let lastW = 0, lastH = 0, lastSky = -1, skyBand = [230, 223, 201], drama = 0;
function frame() {
  const t = clock.getElapsedTime();

  const { w, h } = viewport();                       // a pane sized after load
  if (w !== lastW || h !== lastH) { lastW = w; lastH = h; resize(); }

  /* the sky warms and cools on a ninety-second cycle. Repainted at about
     eight frames a second, which is smooth at this speed and costs almost
     nothing; the fog and the key light follow it so the whole scene turns
     together rather than the sky changing behind a cold sea. */
  /* the sun's arc: theta 0 at sunrise behind the viewer, PI at sunset behind
     the pyramid. Everything else is read off its altitude. */
  /* Time is warped so the sun spends about seventy per cent of the cycle
     above the horizon and hurries through the night: an even split left the
     page dark half the time it was open. */
  /* The page opens at noon — the bright blue the scene started life in —
     and works round to dusk, night, dawn and back to blue. Opening on a
     sunrise meant the first thing anyone saw was the warm phase. */
  /* a dot holds the sky at one point in the day; with none pressed the day
     simply runs. The ships, the swell and the capstone keep their own time
     either way — only the sun is held. */
  /* Each view decides what the sun is doing. A view with `from` set starts
     the day at that point and runs it at its own rate, stopping at `until`
     if it has one; a view with none simply lets the day run. */
  const V = VIEWS[view];
  let dayTime = t;
  let realSky = false, realAlt = 0, realAz = 180, realPhase = 0.5, realMoon = null;
  if (V.live) {
    const now = new Date();
    const sa = sunAngles(now, place.lat, place.lon);
    realSky = true; realAlt = sa.alt; realAz = sa.az;
    realPhase = moonPhaseNow(now);
    realMoon = moonPosition(now, place.lat, place.lon);
    realPhase = realMoon.phase;              // phase and position from one geometry
  }
  if (V.from !== null) {
    const elapsed = (t - viewSince) * V.rate;
    dayTime = (V.from + elapsed / DAY) * DAY;
    if (V.until !== undefined) dayTime = Math.min(dayTime, V.until * DAY);
  }
  const phase = (dayTime / DAY + 0.25) % 1;
  const warped = phase < 0.70 ? (phase / 0.70) * 0.5 : 0.5 + ((phase - 0.70) / 0.30) * 0.5;
  /* ease the sun through the horizon: it hangs there, the way a real sunset
     takes its time and then the light goes quickly once it is under. */
  const raw = warped * Math.PI * 2;
  let theta = raw - Math.sin(raw * 2) * 0.28;
  if (realSky) theta = Math.asin(Math.max(-1, Math.min(1, realAlt / 90)));   // altitude drives it
  let alt = Math.sin(theta);                        // -1 under, +1 overhead
  let sunPos;
  if (realSky) {
    /* east is +Z, because the pyramid's east face is the one turned towards
       the viewer; north is -X. The sun then rises and sets where it really
       does for this place at this hour. */
    alt = Math.sin(realAlt * Math.PI / 180);
    const azr = realAz * Math.PI / 180, ar = realAlt * Math.PI / 180;
    sunPos = new THREE.Vector3(
      -Math.cos(azr) * Math.cos(ar) * SUN_DIST,
      Math.sin(ar) * SUN_DIST,
      Math.sin(azr) * Math.cos(ar) * SUN_DIST);
  } else {
    sunPos = new THREE.Vector3(
      -Math.sin(theta) * SUN_DIST * 0.30,
      alt * SUN_DIST * 0.62,
      Math.cos(theta) * SUN_DIST);
  }
  if (!onMoon) sun.position.copy(sunPos);      // on the Moon the sun is fixed where it was set
  sunSprite.position.copy(sunPos);
  sunSprite.material.opacity = Math.max(0, Math.min(1, (alt + 0.12) * 3));
  /* the disc goes from white overhead to deep orange on the horizon */
  const low = Math.max(0, 1 - Math.max(0, alt) / 0.5);
  sunSprite.material.color.setRGB(1, 1 - low * 0.30, 1 - low * 0.62);
  sunSprite.scale.setScalar(150 + Math.max(0, 1 - Math.abs(alt) * 3) * 130);   // swollen at the horizon

  /* The canvas is only repainted a few times a second — it is a paint job and
     eight frames is plenty. Everything else keyed to the sun is updated every
     frame, because the sun moves every frame and a sea that catches up an
     eighth of a second later reads as lagging behind the sky. */
  drama += ((VIEWS[view].drama || 0) - drama) * 0.04;      // eased, so the dots do not snap
  if (t - lastSky > 0.125) {
    lastSky = t;
    skyBand = paintSky(alt, drama);
    sky.needsUpdate = true;
    sky.dispose();                    // drop the cached cubemap so reflections follow too
    scene.environment = sky;
  }
  renderer.toneMappingExposure = 1.12 + drama * 0.10;

  const lift = Math.max(0, alt);                   // 0 at the horizon, 1 overhead
  const dusk = Math.max(0, 1 - Math.abs(alt) / 0.62);
  const bandCol = new THREE.Color(skyBand[0] / 255, skyBand[1] / 255, skyBand[2] / 255);

  scene.fog.color.copy(bandCol);
  if (!onMoon) sun.intensity = 0.12 + lift * 1.4;
  if (!onMoon) sun.color.setRGB(1, 0.70 + lift * 0.26, 0.44 + lift * 0.46);   // red low, white high
  else sun.color.setRGB(1, 1, 0.98);                            // airless: white, unreddened
  if (!onMoon) hemi.intensity = 0.42 + lift * 0.85;
  hemi.color.copy(bandCol).lerp(new THREE.Color(0xdfefff), lift);

  /* the sails carry the names, so they are lit from within as the light
     fails: barely at noon, strongly once the sun is under */
  const cloth = 0.18 + (1 - lift) * 0.62;
  for (const sh of ships) if (sh.userData.sailMat) sh.userData.sailMat.emissiveIntensity = cloth;

  /* the sea is mixed from its own blue, darkened by how low the sun is, and
     tinted towards whatever the horizon is doing — which is what makes a
     sunset sea go copper rather than staying blue under a pink sky */
  const deep = new THREE.Color(0x2e8fb4).multiplyScalar(0.30 + lift * 0.78);
  water.material.color.copy(deep).lerp(bandCol.clone().multiplyScalar(0.62), dusk * 0.42);
  water.material.envMapIntensity = 0.55 + lift * 0.65;

  /* the procession: each body sits further back along the sun's arc, and
     shows only once the sky is dark enough and it has risen */
  /* the Moon works its way round: one full round of phases every eight days,
     which is quick enough to notice and slow enough not to strobe */
  const MOON_MONTH = 8;
  /* The phase is always tonight's real one, in every view. It used to run on
     a synthetic cycle whenever the view was not the live sky, so the stamp
     could read "full" while the glyph drew a quarter — two clocks for one
     moon. Only its POSITION falls back to the arc when the sky is scripted. */
  const moonPhase = moonPhaseNow(new Date());
  const moonLag = moonPhase * Math.PI * 2;
  if (Math.abs(moonPhase - lastMoonPhase) > 0.004) {
    lastMoonPhase = moonPhase;
    paintMoon(moonPhase);
    moonTex.needsUpdate = true;
  }

  for (const pl of PLANETS) {
    if (!pl.moon && realSky && pl.real) {
      const pp = planetPosition(pl.real, new Date(), place.lat, place.lon);
      const ar = pp.alt * Math.PI / 180;
      pl.sprite.position.set(-Math.cos(pp.az) * Math.cos(ar) * SUN_DIST,
                             Math.sin(ar) * SUN_DIST,
                             Math.sin(pp.az) * Math.cos(ar) * SUN_DIST);
      /* a risen body stays faintly marked in daylight: it is a reference
         point whether or not the sky is dark enough to show it properly */
      pl.sprite.material.opacity = Math.max(0, Math.min(1, Math.sin(ar) * 6))
        * (0.16 + Math.max(0, Math.min(1, (0.10 - alt) * 4)) * 0.84) * pl.mag;
      continue;
    }
    if (pl.moon && realMoon) {
      /* the real Moon: its own altitude and azimuth, on the same compass as
         the sun — east is +Z, north is -X */
      const ar = realMoon.alt * Math.PI / 180;
      pl.sprite.position.set(
        -Math.cos(realMoon.az) * Math.cos(ar) * SUN_DIST,
        Math.sin(ar) * SUN_DIST,
        Math.sin(realMoon.az) * Math.cos(ar) * SUN_DIST);
      const risen = Math.max(0, Math.min(1, Math.sin(ar) * 6));
      const dark = Math.max(0, Math.min(1, (0.55 - alt) * 2.2));
      pl.sprite.material.opacity = risen * dark * pl.mag;
      const ms = pl.sprite.position.clone().project(camera);
      const ss = sunPos.clone().project(camera);
      pl.sprite.material.rotation = Math.atan2(ss.y - ms.y, ss.x - ms.x) - Math.PI / 2;
      continue;
    }
    const th = theta - (pl.moon ? moonLag : pl.lag);
    const a = Math.sin(th);
    pl.sprite.position.set(
      -Math.sin(th) * SUN_DIST * 0.30 + Math.sin(th * 2) * SUN_DIST * pl.tilt * 0.35,
      a * SUN_DIST * 0.62 + pl.tilt * SUN_DIST * 0.06,
      Math.cos(th) * SUN_DIST);
    const risen = Math.max(0, Math.min(1, a * 6));          // above the horizon
    const dark = pl.moon
      ? Math.max(0, Math.min(1, (0.55 - alt) * 2.2))     // the Moon shows in a bright sky too
      : Math.max(0, Math.min(1, (0.18 - alt) * 3.2));    // the planets need it dim
    pl.sprite.material.opacity = risen * dark * pl.mag;
    if (pl.moon) {
      /* point the lit side at the sun, in screen terms */
      const ms = pl.sprite.position.clone().project(camera);
      const ss = sunPos.clone().project(camera);
      pl.sprite.material.rotation = Math.atan2(ss.y - ms.y, ss.x - ms.x) - Math.PI / 2;
    }
  }

  {                                                // the sky turns
    const dS = Date.now() / 86400000 - 10957.5;
    const gmst = (18.697374558 + 24.06570982441908 * dS) % 24;
    const lstDeg = ((gmst * 15 + place.lon) % 360 + 360) % 360;
    starTilt.rotation.z = (90 - place.lat) * Math.PI / 180;
    starSpin.rotation.y = -lstDeg * Math.PI / 180;
    starMat.opacity = Math.max(0, Math.min(1, (-alt - 0.02) * 3.4)) * 0.95;
    /* the frame shows in daylight too, faintly — it is what the opening view
       has in place of landmarks */
    const night = Math.max(0, Math.min(1, (0.10 - alt) * 3));
    ecliptic.material.opacity = (0.13 + night * 0.30) * ecliptic.userData.weight;
    galactic.material.opacity = (0.09 + night * 0.24) * galactic.userData.weight;
    draco.material.opacity = 0.05 + night * 0.26;
    for (const o of namedLabels) o.material.opacity = 0.14 + night * 0.7;
    updateClock(Date.now());
    const up = Math.max(0, Math.min(1, (0.16 - alt) * 2.4));
    clockBand.material.opacity = 0.25 + up * 0.6;
    clockRay.material.opacity = up * 0.42;
  }

  for (const m of MIST) {                          // drift, breathe, take the sky's colour
    const u = m.userData;
    m.material.map.offset.x += u.drift * 0.016;
    const breathe = 0.55 + 0.45 * Math.sin(t * 0.055 * u.puff + u.puff * 3);
    m.material.opacity = u.base * breathe * (0.55 + dusk * 0.5);
    m.material.color.copy(bandCol).lerp(new THREE.Color(0xffffff), 0.45);
  }

  for (const pl of PLANETS) {                    // the names, beside their bodies
    if (!pl.label) continue;
    pl.label.position.copy(pl.sprite.position).multiplyScalar(0.985);
    pl.label.position.y -= 46;
    pl.label.material.opacity = Math.min(0.8, pl.sprite.material.opacity * 1.5);
  }

  /* the glitter track lies between the viewer and the sun, and only when the
     sun is low enough to lay one */
  const lowSun = Math.max(0, 1 - Math.abs(alt) * 2.2) * Math.max(0, Math.sign(sunPos.z) * 0.5 + 0.5);
  glitter.material.opacity = lowSun * 0.7;
  if (lowSun > 0.01) {
    glitter.position.x = sunPos.x * 0.12;
    glitter.position.z = -60;
    glitter.rotation.z = Math.atan2(sunPos.x, -sunPos.z) * 0.4;
  }

  const a = waterGeo.attributes.position.array;        // the swell
  for (let i = 0; i < a.length; i += 3) {
    const x = waterBase[i], y = waterBase[i + 1];
    a[i + 2] = Math.sin(x * 0.05 + t * 0.7) * 0.55
             + Math.cos(y * 0.07 - t * 0.5) * 0.4
             + Math.sin((x + y) * 0.16 + t * 1.5) * 0.14;   // near-field chop
  }
  waterGeo.attributes.position.needsUpdate = true;
  waterNrm.offset.set(t * 0.012, t * 0.02);            // the chop drifts

  for (const s of ships) {                             // every ship rides it
    const ph = s.userData.phase, home = s.userData.home;
    const lift = (s === hovered ? 0.5 : 0) + (s === chosen ? 1.1 : 0);
    /* hovering brings a ship out of the line and lifts the thread, so the
       sail is both nearer and brighter while you read it */
    const want = (s === hovered ? 1 : 0);
    s.userData.near = (s.userData.near || 0) + (want - (s.userData.near || 0)) * 0.08;
    s.userData.sailMat.emissiveIntensity = 0.85 + s.userData.near * 0.75;
    /* the cloth working: two travelling waves across it plus a slow belly,
       all scaled by how far down the sail a vertex sits, so the head stays
       laced to the yard and the foot does the moving */
    const cl = s.userData.cloth;
    if (cl) {
      const g = cl.geometry, rest = g.userData.rest, pos = g.attributes.position;
      const hHalf = clothHalf(g);
      for (let i = 0; i < pos.count; i++) {
        const rx = rest[i * 3], ry = rest[i * 3 + 1];
        const loose = Math.min(1, (hHalf - ry) / (hHalf * 2));     // 0 at the head, 1 at the foot
        const w = Math.sin(rx * 0.9 - t * 2.1 + ph) * 0.42
                + Math.sin(rx * 1.9 + ry * 0.7 - t * 3.3 + ph * 1.7) * 0.18
                + Math.sin(t * 0.8 + ph) * 0.3;                    // the belly
        /* one-sided: the cloth always bellies away from the spar, never
           back through it, so the wave travels without the mast appearing */
        pos.setZ(i, (0.5 + w * 0.5) * loose * loose);
      }
      pos.needsUpdate = true;
      g.computeVertexNormals();
    }

    if (s.userData.neonMats) {                     // a slow throb, brighter on hover
      const beatN = 0.72 + 0.28 * Math.sin(t * 1.15 + ph * 2.1);
      s.userData.neonMats[0].opacity = (0.55 + s.userData.near * 0.4) * beatN;
      s.userData.neonMats[1].opacity = (0.18 + s.userData.near * 0.22) * beatN;
    }
    /* ------------------------------------------------- station keeping
       Each craft wanders around its own place in the formation on three
       slow cycles that never line up, so the drift never repeats. It is
       then pushed away from any neighbour that comes too close, and the
       whole wander is damped to nothing while the mouse is on the fleet —
       so pointing at a ship settles the formation rather than chasing a
       moving target. */
    const calm = Math.max(s.userData.near || 0, hovered ? 0.75 : 0, chosen ? 1 : 0);
    const wander = 1 - calm;
    s.userData.calm = calm;
    const wx = (Math.sin(t * 0.21 + ph * 1.7) * 3.4 + Math.sin(t * 0.09 + ph) * 2.2) * wander;
    const wy = (Math.sin(t * 0.27 + ph * 2.3) * 1.5 + Math.sin(t * 0.13 + ph * 0.6) * 0.9) * wander;
    const wz = Math.sin(t * 0.17 + ph * 1.1) * 2.6 * wander;
    s.userData.drift = { x: wx, y: wy, z: wz };

    /* a proper sea state: heave on two periods so it never repeats cleanly,
       roll, pitch, a slow yaw as the hull hunts around its anchor, and a
       surge back and forth along its own length. */
    const heave = Math.sin(t * 0.9 + ph) * 0.42 + Math.sin(t * 0.37 + ph * 1.7) * 0.22;
    /* it hovers: the resting height is well clear of the water, and the
       heave is the craft holding station on its field rather than a hull
       riding a swell. */
    const ride = (s.userData.hoverH || 4.4);
    s.position.y += ((ride + heave * 0.55 + lift + wy) - s.position.y) * 0.06;
    /* the pool of light it throws on the sea, which stays on the water while
       the craft rises and falls above it, and dims as it climbs */
    if (s.userData.pool) {
      const pl = s.userData.pool;
      if (!pl.parent) scene.add(pl);
      pl.position.set(s.position.x, 0.12, s.position.z);
      const gap = Math.max(0.1, s.position.y);
      const spread = 1 + gap * 0.055;
      pl.scale.set(spread * 1.35, 0.62 * spread, spread * 1.35);
      /* brighter, and it wavers with the swell, so the accent colour is
         clearly in the water rather than painted under the hull */
      const flicker = 0.86 + 0.14 * Math.sin(t * 2.3 + ph * 1.9);
      pl.material.opacity = (0.72 / spread) * flicker;
    }
    if (s.userData.thrusters) {                    // the wash under the keel
      const th = 0.6 + 0.4 * Math.sin(t * 3.1 + ph * 2);
      for (let k = 0; k < s.userData.thrusters.length; k++) {
        const sp = s.userData.thrusters[k];
        sp.material.opacity = 0.45 + th * 0.4;
        sp.scale.setScalar((s.userData.len * 0.055) * (2.4 + th * 0.5));
      }
    }
    s.rotation.z = Math.sin(t * 0.7 + ph) * 0.075 + Math.sin(t * 0.23 + ph) * 0.03;   // roll
    s.rotation.x = Math.cos(t * 0.55 + ph) * 0.045;                                    // pitch
    s.rotation.y = Math.PI / 2 + Math.sin(t * 0.19 + ph * 0.6) * 0.07;                 // yaw
    const twin = s.userData.twin;
    if (twin) {
      /* a true mirror about the waterline, so the gap under the hull is
         matched by the gap above its reflection */
      twin.position.set(s.position.x, -s.position.y, s.position.z);
      twin.rotation.set(-s.rotation.x, s.rotation.y, -s.rotation.z);
      /* the swell stretches and shears it */
      twin.scale.set(1 + Math.sin(t * 1.1 + ph) * 0.03,
                     -(0.78 + Math.sin(t * 0.8 + ph) * 0.06),
                     1);
      twin.position.x += Math.sin(t * 1.4 + ph) * 0.25;
    }

    /* Hovering brings a ship five of its own lengths forward — enough that
       the sail fills a good part of the frame and the embroidery can be
       read. Clamped so it can never arrive in the camera's lap: it stops a
       clear 34 units short of the eye. */
    /* hovering nudges a craft forward, it does not send it across the bay.
       Five hull lengths put the sail in your face and half a length was
       too timid to read; two is the distance where a craft clearly steps
       out of the line and the formation still holds. */
    const reach = (s.userData.len || 15) * 2;
    const wanted = (s === chosen ? 26 : 0) + s.userData.near * reach;
    const room = Math.max(0, CAM_HOME.z - 34 - home.z);
    const tz = home.z + Math.min(wanted, room) + wz;
    const tx = home.x + (s === chosen ? -home.x * 0.25 : 0) + wx;
    s.position.z += (tz - s.position.z) * 0.045;
    s.position.x += (tx - s.position.x) * 0.045;
    s.position.x += Math.sin(t * 0.31 + ph) * 0.06;        // slow sideways set
    s.position.z += Math.sin(t * 0.44 + ph * 1.3) * 0.05;  // surge
  }

  /* the capstone drifts and turns, slowly enough to notice only on a second
     look, which is the point of it */
  const capY = pyramid.userData.capY + Math.sin(t * 0.25) * 2.2;
  pyramid.userData.cap.position.y = capY;
  /* one turn every twenty seconds or so: slow enough to be calm, quick
     enough that the gold catches a new face while you are looking at it. */
  pyramid.userData.cap.rotation.y = Math.PI / 4 + t * 0.32;
  pyramid.userData.cap.rotation.z = Math.sin(t * 0.17) * 0.05;   // a slight list
  pyramid.userData.capEdges.position.y = capY;
  pyramid.userData.capEdges.rotation.y = pyramid.userData.cap.rotation.y;
  pyramid.userData.capEdges.rotation.z = pyramid.userData.cap.rotation.z;
  /* the capstone breathes: two cycles of different length so the pulse never
     settles into an obvious rhythm */
  /* two cycles added rather than multiplied — multiplied, they cancel and the
     capstone barely moves. */
  const beat = 0.5 + 0.34 * Math.sin(t * 0.55) + 0.16 * Math.sin(t * 0.21 + 1.3);
  capFaceMat.emissiveIntensity = 0.42 + beat * 0.55;
  const glow = pyramid.userData.halo;
  glow.position.y = capY + CAP_H * 0.45;
  glow.material.opacity = 0.55 + beat * 0.42;
  glow.scale.setScalar(CAP_R * (3.1 + beat * 0.7));
  /* the shaft rides the same beat, and stands on top of the capstone */
  const bm = pyramid.userData.beam;
  bm.position.y = capY + CAP_H / 2 + BEAM_H / 2;
  bm.material.opacity = 0.55 + beat * 0.45;
  /* the shaft draws in and opens again: full width at the top of the beat,
     a fifth of it at the bottom, on the same cycle as the glow so the beacon
     brightens as it widens. */
  const draw = 0.20 + beat * 0.80;
  bm.scale.set(draw, 1, draw);

  /* keep their distance: any pair closer than a hull length and a half is
     eased apart, along the line between them. Cheap at five craft, and it
     is what stops the wander turning into a collision. */
  const KEEP = 26;
  for (let i = 0; i < ships.length; i++) {
    for (let j = i + 1; j < ships.length; j++) {
      const a = ships[i], b = ships[j];
      const dx = b.position.x - a.position.x, dz = b.position.z - a.position.z;
      const d = Math.hypot(dx, dz);
      if (d > KEEP || d < 0.001) continue;
      const push = (KEEP - d) / KEEP * 0.22 * (1 - Math.max(a.userData.calm || 0, b.userData.calm || 0));
      const ux = dx / d, uz = dz / d;
      a.position.x -= ux * push; a.position.z -= uz * push;
      b.position.x += ux * push; b.position.z += uz * push;
    }
  }

  /* a slow pass across the fleet and a gentle rise and fall, so the scene is
     never quite still even with the mouse untouched. Two periods that do not
     divide into one another, so it never returns to the same place. */
  /* The drift stands down while the pointer is on the scene. Chasing a
     target that is itself sliding is the thing that made hovering awkward:
     the moment the mouse is over the canvas the camera settles, and it
     picks the wander back up a second after the mouse leaves.

     The pointer also steers, gently — the view leans the way you are
     looking, which makes reaching a ship at the edge of the frame a matter
     of moving towards it rather than dragging. */
  if (slew) {
    /* ease onto the bearing by the shortest way round the compass */
    let dy = slew.yaw - yaw;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    yaw += dy * 0.06;
    const baseElNow = Math.atan2(CAM_HOME.y * (VIEWS[view].camera.look) - camera.position.y, CAM_HOME.z);
    pitch += ((slew.el - baseElNow) - pitch) * 0.06;
    if (Math.abs(dy) < 0.01 && Math.abs((slew.el - baseElNow) - pitch) < 0.01) slew = null;
  }

  const wantSteady = pointerOn ? 1 : 0;
  steady += (wantSteady - steady) * 0.035;
  const roam = 1 - steady;
  const driftX = (Math.sin(t * 0.043) * CAM_HOME.z * 0.13
                + Math.sin(t * 0.017) * CAM_HOME.z * 0.05) * roam
                + ptr.x * CAM_HOME.z * 0.06 * steady;
  const driftY = (Math.sin(t * 0.031 + 1.3) * CAM_HOME.y * 0.5
                + Math.sin(t * 0.011) * CAM_HOME.y * 0.22) * roam
                + ptr.y * CAM_HOME.y * 0.5 * steady;

  /* an orbit rather than a slide: the eye swings round the fleet on the
     radius the view was fitted at, so the whole sky is reachable */
  const orbit = CAM_HOME.z;
  const wantX = CAM_HOME.x + driftX + Math.sin(yaw) * orbit;
  const wantZ = Math.cos(yaw) * orbit;
  camera.position.x += (wantX - camera.position.x) * 0.05;
  camera.position.z += (wantZ - camera.position.z) * 0.05;
  camera.position.y += ((CAM_HOME.y + driftY + (chosen ? 5 : 0) + pitch * 34) - camera.position.y) * 0.05;
  camera.position.z += ((CAM_HOME.z + (chosen ? 14 : 0)) - camera.position.z) * 0.05;
  /* looking up: the aim point climbs with the pitch, so dragging upward
     sweeps the sky rather than merely raising the eye */
  /* Aim as an ANGLE. Treating the pitch as a height to look at meant the
     aim ran away with distance — at full tilt the camera pointed almost
     straight up and skipped over everything between. A bearing and an
     elevation behave the way a head does. */
  const baseEl = Math.atan2(CAM_HOME.y * (VIEWS[view].camera.look) - camera.position.y, orbit);
  const el = baseEl + pitch;
  const aim = new THREE.Vector3(
    camera.position.x + (-Math.sin(yaw)) * Math.cos(el) * 100,
    camera.position.y + Math.sin(el) * 100,
    camera.position.z + (-Math.cos(yaw)) * Math.cos(el) * 100);
  camera.lookAt(aim);

  /* ------------------------------------------------------------ the jump
     Three seconds: the craft swings onto the bearing and runs out ahead,
     the streaks come up, the frame whites out, and you are there. The
     camera follows the craft rather than cutting, so the departure reads
     as a departure. */
  if (flight) {
    flight.t += 1 / 60;
    const k = Math.min(1, flight.t / flight.dur);
    const ease = k * k * k;                       // slow, then very fast
    if (craft) {
      craft.position.addScaledVector(flight.bearing, ease * 26);
      craft.scale.setScalar(Math.max(0.05, 1 - ease * 0.95));
    }
    streaks.material.opacity = Math.min(0.85, k * 1.6) * (1 - Math.max(0, (k - 0.82) / 0.18));
    streaks.position.copy(camera.position);
    streaks.lookAt(camera.position.clone().add(flight.bearing));
    streaks.children;
    if (k > 0.82) flash.style.opacity = String((k - 0.82) / 0.18 * 0.9);
    if (k >= 1) {
      flash.style.opacity = '0';
      if (craft) { craft.scale.setScalar(1); }    // it is stowed, not destroyed
      finishJump();
    }
  } else if (!arrived) {
    flash.style.opacity = '0';
  }
  if (arrived) {
    /* hold station: the body stays ahead of the eye wherever you look, and
       turns under you */
    arrivalBody.rotation.y += 0.0012;
    const fwd2 = new THREE.Vector3();
    camera.getWorldDirection(fwd2);
    const want = camera.position.clone().addScaledVector(fwd2, arrivalBody.scale.x * 3.2);
    arrivalBody.position.lerp(want, 0.02);
  }
  /* the reticle rides the locked body, whether or not it is in frame */
  if (target && target.sprite) {
    reticle.position.copy(target.sprite.position);
    reticle.material.opacity = 0.55 + 0.25 * Math.sin(t * 3);
    const st = targetState(target);
    edgeMark(target, st.ok);
  } else {
    reticle.material.opacity = 0;
    edgeMark(null, true);
  }

  if (hudFrame++ % 20 === 0) { refreshHud(); paintTip(); }   // the sky moves; so do the answers

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
setTimeout(() => hint.classList.add('gone'), 9000);
</script>
</body></html>
